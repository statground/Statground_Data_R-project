name: R Project - Website Directory

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit website fetches; 0 means all configured seeds"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: r-project-websites
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e collectors/rpkg
      - name: Run R website directory collector
        env:
          RPKG_KAFKA_TOPIC: ${{ vars.RPKG_KAFKA_TOPIC || 'rpkg.events' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          RPKG_R_WEBSITE_LIMIT: ${{ github.event.inputs.limit || vars.RPKG_R_WEBSITE_LIMIT || '0' }}
          RPKG_R_WEBSITE_URLS: ${{ vars.RPKG_R_WEBSITE_URLS }}
          RPKG_WEBSITE_MENTION_PACKAGES: ${{ vars.RPKG_WEBSITE_MENTION_PACKAGES }}
        run: rpkg-collector r-websites --limit "$RPKG_R_WEBSITE_LIMIT"
