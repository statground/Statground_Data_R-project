name: R Package Intelligence Collectors

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Collector job to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cran_metadata
          - cran_downloads
          - cran_reverse_dependencies
          - cran_checks
          - cran_archive
          - r_core_news
          - r_websites
          - sample
      dry_run:
        description: "Print events instead of publishing to Kafka"
        required: false
        default: false
        type: boolean
      metadata_limit:
        description: "Limit CRAN metadata rows; 0 means all"
        required: false
        default: "0"
      download_top:
        description: "Number of top CRAN packages for download collection"
        required: false
        default: "100"
permissions:
  contents: read

concurrency:
  group: r-package-intelligence-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e collectors/rpkg

      - name: Validate runtime configuration
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          test -n "$KAFKA_BROKERS" || { echo "KAFKA_BROKERS or KAFKA_BOOTSTRAP_SERVERS secret is required"; exit 1; }
          test -n "$KAFKA_USERNAME" || { echo "KAFKA_USERNAME or KAFKA_EXTERNAL_USER secret is required"; exit 1; }
          test -n "$KAFKA_PASSWORD" || { echo "KAFKA_PASSWORD or KAFKA_EXTERNAL_PASSWORD secret is required"; exit 1; }
          case ",$KAFKA_BROKERS," in
            *,127.0.0.1:*|*,localhost:*|*,0.0.0.0:*|*,[::1]:*)
              echo "KAFKA_BROKERS must be a public IP/domain endpoint, not a loopback address"
              exit 1
              ;;
          esac

      - name: Run collector
        env:
          RPKG_KAFKA_TOPIC: ${{ vars.RPKG_KAFKA_TOPIC || 'rpkg.events' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          KAFKA_PRODUCER_MESSAGE_MAX_BYTES: "12582912"
          RPKG_CRAN_METADATA_LIMIT: ${{ vars.RPKG_CRAN_METADATA_LIMIT || '0' }}
          RPKG_DOWNLOAD_TOP: ${{ vars.RPKG_DOWNLOAD_TOP || '100' }}
          RPKG_DOWNLOAD_PERIOD: ${{ vars.RPKG_DOWNLOAD_PERIOD || 'last-month' }}
        run: |
          job="${{ inputs.job }}"
          dry_run="${{ inputs.dry_run }}"
          metadata_limit="${{ inputs.metadata_limit }}"
          download_top="${{ inputs.download_top }}"

          if [ -z "$job" ]; then job="all"; fi
          if [ -z "$dry_run" ]; then dry_run="false"; fi
          if [ -z "$metadata_limit" ]; then metadata_limit="$RPKG_CRAN_METADATA_LIMIT"; fi
          if [ -z "$download_top" ]; then download_top="$RPKG_DOWNLOAD_TOP"; fi

          dry_args=""
          if [ "$dry_run" = "true" ]; then dry_args="--dry-run"; fi

          case "$job" in
            all)
              rpkg-collector run-due-jobs $dry_args --metadata-limit "$metadata_limit" --download-top "$download_top"
              ;;
            cran_metadata)
              rpkg-collector cran-metadata $dry_args --limit "$metadata_limit"
              ;;
            cran_downloads)
              rpkg-collector cran-downloads $dry_args --top "$download_top"
              ;;
            cran_reverse_dependencies)
              rpkg-collector cran-reverse-dependencies $dry_args
              ;;
            cran_checks)
              rpkg-collector cran-checks $dry_args
              ;;
            cran_archive)
              rpkg-collector cran-archive $dry_args
              ;;
            r_core_news)
              rpkg-collector r-core-news $dry_args
              ;;
            r_websites)
              rpkg-collector r-websites $dry_args
              ;;
            sample)
              rpkg-collector emit-sample $dry_args
              ;;
            *)
              echo "Unknown job: $job"
              exit 1
              ;;
          esac
