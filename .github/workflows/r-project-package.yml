name: R Project Package Collection

on:
  schedule:
    # 00:51 KST. Placed between the late Polymarket and early NAVER windows.
    - cron: "51 15 * * *"
  push:
    tags:
      - "r-package-collection-*"
  workflow_dispatch:
    inputs:
      r_package_job:
        description: "all runs the split pipeline; comma-separated jobs run one diagnostic worker"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: r-project-package-pipeline
  cancel-in-progress: false

jobs:
  package_manual:
    if: github.event_name == 'workflow_dispatch' && inputs.r_package_job != '' && inputs.r_package_job != 'all'
    name: Package collector (manual custom jobs)
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: ${{ inputs.r_package_job || 'all' }}
    secrets: inherit

  package_core_metadata:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    name: Package core metadata
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-metadata,cran-downloads,cran-checks
    secrets: inherit

  package_archive:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_core_metadata
    name: Package archive history
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-archive
    secrets: inherit

  package_task_views:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_archive
    name: Package task views
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-task-views
    secrets: inherit

  package_news:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_task_views
    name: Package release news
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: r-core-news,package-news
    secrets: inherit

  package_dependencies:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_news
    name: Package dependency graph (shard ${{ matrix.shard_index }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard_index: [0, 1, 2, 3]
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-reverse-dependencies
      r_package_reverse_shard_count: "4"
      r_package_reverse_shard_index: ${{ format('{0}', matrix.shard_index) }}
    secrets: inherit

  package_pages:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_dependencies
    name: Package pages and repositories
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-package-pages,bioconductor,bioconductor-package-pages,runiverse,runiverse-package-pages
    secrets: inherit

  package_external_signals:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.r_package_job == '' || inputs.r_package_job == 'all'))
    needs: package_pages
    name: Package external signals
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: cran-website-discovery,r-websites,github-repos,osv-security,bibliometric-mentions
    secrets: inherit
