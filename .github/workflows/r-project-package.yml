name: R Project Package Collection

on:
  schedule:
    # 00:51 KST. Placed between the late Polymarket and early NAVER windows.
    - cron: "51 15 * * *"
  workflow_dispatch:
    inputs:
      r_package_job:
        description: "R Package Ecosystem jobs: all or comma-separated jobs"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  package:
    name: Package collector
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: package
      r_package_job: ${{ inputs.r_package_job || vars.RPKG_JOB || 'all' }}
    secrets: inherit
