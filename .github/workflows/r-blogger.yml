name: R Blogger

on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-blogger
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Collect R-bloggers
        env:
          KAFKA_TOPIC: webr.events
          KAFKA_CLIENT_ID: statground-rblogger-crawler
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          TRANSLATE_ENABLED: ${{ vars.RBLOGGER_TRANSLATE_ENABLED || 'true' }}
          MAX_PAGES_FROM_HOME: ${{ vars.RBLOGGER_MAX_PAGES_FROM_HOME || '1' }}
          MAX_URLS: ${{ vars.RBLOGGER_MAX_URLS || '0' }}
          STALE_TRANSLATION_LIMIT: ${{ vars.RBLOGGER_STALE_TRANSLATION_LIMIT || '20' }}
          SLEEP_SEC: ${{ vars.RBLOGGER_SLEEP_SEC || '1.0' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: go run ./cmd/rblogger-pipeline
