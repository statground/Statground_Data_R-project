name: R Package - CRAN Downloads

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Top CRAN packages to collect"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: r-package-cran-downloads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e collectors/rpkg
      - name: Run CRAN downloads collector
        env:
          RPKG_KAFKA_TOPIC: ${{ vars.RPKG_KAFKA_TOPIC || 'rpkg.events' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          RPKG_DOWNLOAD_TOP: ${{ github.event.inputs.top || vars.RPKG_DOWNLOAD_TOP || '100' }}
          RPKG_DOWNLOAD_PERIOD: ${{ vars.RPKG_DOWNLOAD_PERIOD || 'last-month' }}
        run: rpkg-collector cran-downloads --top "$RPKG_DOWNLOAD_TOP" --period "$RPKG_DOWNLOAD_PERIOD"
