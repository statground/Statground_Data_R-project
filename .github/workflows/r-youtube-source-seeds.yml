name: R YouTube - Source Seeds

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit seed rows; 0 means all seeds"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: r-youtube-source-seeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e collectors/rpkg
      - name: Publish R YouTube source seeds
        env:
          RPKG_KAFKA_TOPIC: ${{ vars.R_YOUTUBE_KAFKA_TOPIC || 'r.youtube.events' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          R_YOUTUBE_SEED_LIMIT: ${{ github.event.inputs.limit || vars.R_YOUTUBE_SEED_LIMIT || '0' }}
        run: rpkg-collector youtube-source-seeds --limit "$R_YOUTUBE_SEED_LIMIT"

