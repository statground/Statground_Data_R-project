name: R Project Community Collection

on:
  schedule:
    # 19:21 KST. Five hours after social and five hours before CDN publish.
    - cron: "21 10 * * *"
  workflow_dispatch:
    inputs:
      r_community_since_days:
        description: "Only keep R Community items newer than N days when published_at exists. Use -1 for no date filtering."
        required: false
        default: "7"
      webr_notebook_date:
        description: "Web-R Notebook series date in Asia/Seoul, YYYY-MM-DD. Empty means today."
        required: false
        default: ""
      webr_notebook_force_new:
        description: "Create another Web-R Notebook post even when today's generated post already exists."
        required: false
        default: "false"
      webr_notebook_dry_run:
        description: "Run webR and build the notebook row without inserting it."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  community:
    name: Community collector
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: community
      r_community_since_days: ${{ inputs.r_community_since_days || vars.R_COMMUNITY_SINCE_DAYS || '7' }}
      webr_notebook_date: ${{ inputs.webr_notebook_date || '' }}
      webr_notebook_force_new: ${{ inputs.webr_notebook_force_new || 'false' }}
      webr_notebook_dry_run: ${{ inputs.webr_notebook_dry_run || 'false' }}
    secrets: inherit
