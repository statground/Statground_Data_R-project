name: R Project Contract Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-project-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Go contracts without secrets
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download all
          go mod verify
          go test -mod=mod ./...
          go vet ./...

      - name: Validate Python contracts without external services
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -format '{{json .}}' .github/workflows/*.yml
