name: Sync R Foundation Mastodon to Kafka

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - backfill
      force_republish:
        description: "Republish even when payload_hash is unchanged"
        required: false
        default: false
        type: boolean

  schedule:
    # UTC. Run once per hour and avoid the top of the hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-r-foundation-mastodon-to-kafka
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required Kafka secrets
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
          TRANSLATE_ENABLED: ${{ vars.MASTODON_TRANSLATE_ENABLED || 'true' }}
        run: |
          test -n "$KAFKA_BROKERS" || { echo "KAFKA_BROKERS or KAFKA_BOOTSTRAP_SERVERS secret is required"; exit 1; }
          test -n "$KAFKA_USERNAME" || { echo "Kafka SASL username is required. Add KAFKA_USERNAME or KAFKA_EXTERNAL_USER"; exit 1; }
          test -n "$KAFKA_PASSWORD" || { echo "Kafka SASL password is required. Add KAFKA_PASSWORD or KAFKA_EXTERNAL_PASSWORD"; exit 1; }
          case ",$KAFKA_BROKERS," in
            *,127.0.0.1:*|*,localhost:*|*,0.0.0.0:*|*,[::1]:*)
              echo "KAFKA_BROKERS must be a public IP/domain endpoint, not a loopback address"
              exit 1
              ;;
          esac
          TRANSLATE_ENABLED_LC="$(printf '%s' "${TRANSLATE_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          AI_PROVIDER_COUNT=0
          test -n "$OPENROUTER_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$GROQ_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$CEREBRAS_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$GH_MODELS_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          if [ "$TRANSLATE_ENABLED_LC" != "false" ] && [ "$AI_PROVIDER_COUNT" -eq 0 ]; then
            echo "At least one AI provider secret is required when translation is enabled"
            exit 1
          fi

      - name: Fetch Mastodon and produce Kafka events
        env:
          MASTODON_INSTANCE: "https://fosstodon.org"
          MASTODON_ACCT: "R_Foundation"
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_ACCOUNT_ID: ${{ vars.MASTODON_R_FOUNDATION_ACCOUNT_ID }}

          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_TOPIC: "webr.events"
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: "PLAIN"
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          KAFKA_PRODUCER_MESSAGE_MAX_BYTES: "12582912"

          TRANSLATE_ENABLED: ${{ vars.MASTODON_TRANSLATE_ENABLED || 'true' }}
          MASTODON_TRANSLATION_MODEL: ${{ vars.MASTODON_TRANSLATION_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          FAIL_ON_TRANSLATION_ERROR: ${{ vars.MASTODON_FAIL_ON_TRANSLATION_ERROR || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}

          STATE_FILE: "data/mastodon/r_foundation/state.json"
          EXCLUDE_REBLOGS: "true"
          EXCLUDE_REPLIES: "false"
          CRAWL_IMAGES_BASE64: "true"
          MAX_IMAGE_BYTES: "5242880"
          MAX_TOTAL_IMAGE_BYTES: "9437184"
          MAX_STATUS_IMAGES: "4"
          MAX_KAFKA_EVENT_BYTES: "11534336"
          REQUEST_SLEEP_SECONDS: "0.4"
          USER_AGENT: "StatgroundBot/1.0 (+https://www.statground.net; Mastodon public feed mirror)"
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            mode="incremental"
          fi

          force_republish="${{ inputs.force_republish }}"
          if [ -z "$force_republish" ]; then
            force_republish="false"
          fi

          echo "SYNC_MODE=$mode"
          SYNC_MODE="$mode" FORCE_REPUBLISH="$force_republish" python scripts/fetch_r_foundation_mastodon_to_kafka.py

      - name: Commit crawler state
        run: |
          if [ -n "$(git status --porcelain data/mastodon/r_foundation)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/mastodon/r_foundation
            git commit -m "Update R Foundation Mastodon crawler state"
            git pull --rebase
            git push
          else
            echo "No state changes."
          fi
