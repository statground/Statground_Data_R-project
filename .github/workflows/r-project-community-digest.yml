name: R Project Community Digest

on:
  schedule:
    # 16:51 KST. Runs after community source collection and before notebook generation.
    - cron: "51 7 * * *"
  workflow_dispatch:
    inputs:
      r_community_since_days:
        description: "Digest source rows newer than N days; -1 means all."
        required: false
        default: "7"

permissions:
  contents: write

jobs:
  digest:
    name: Community digest
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: community-digest
      r_community_since_days: ${{ inputs.r_community_since_days || vars.R_COMMUNITY_SINCE_DAYS || '7' }}
    secrets: inherit
