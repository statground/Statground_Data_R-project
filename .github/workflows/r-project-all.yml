name: R Project Data Collection

on:
  schedule:
    - cron: "56 3-23/4 * * *"
  workflow_dispatch:
    inputs:
      r_package_job:
        description: "R Package Ecosystem jobs: all or comma-separated jobs"
        required: false
        default: "all"
      r_youtube_job:
        description: "R YouTube jobs: all, seeds, pages, search, links, videos, transcripts, comments, or backfill-metadata"
        required: false
        default: "all"
      rblogger_rebuild_board:
        description: "Retranslate all active R-Blogger raw rows into board"
        required: false
        default: "false"
      mastodon_backfill_board:
        description: "Translate missing or fallback Mastodon board rows only"
        required: false
        default: "false"
      r_community_since_days:
        description: "Only keep R Community items newer than N days when published_at exists. Use -1 for no date filtering."
        required: false
        default: "14"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r-project-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set run options
        id: opts
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "r_package_job=${{ inputs.r_package_job }}" >> "$GITHUB_OUTPUT"
            echo "r_youtube_job=${{ inputs.r_youtube_job }}" >> "$GITHUB_OUTPUT"
            echo "rblogger_rebuild_board=${{ inputs.rblogger_rebuild_board }}" >> "$GITHUB_OUTPUT"
            echo "mastodon_backfill_board=${{ inputs.mastodon_backfill_board }}" >> "$GITHUB_OUTPUT"
            echo "r_community_since_days=${{ inputs.r_community_since_days }}" >> "$GITHUB_OUTPUT"
          else
            echo "r_package_job=${{ vars.RPKG_JOB || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "r_youtube_job=${{ vars.R_YOUTUBE_JOB || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "rblogger_rebuild_board=false" >> "$GITHUB_OUTPUT"
            echo "mastodon_backfill_board=false" >> "$GITHUB_OUTPUT"
            echo "r_community_since_days=${{ vars.R_COMMUNITY_SINCE_DAYS || '7' }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Install yt-dlp metadata fallback
        run: |
          python -m pip install --user yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Kafka settings
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
        run: |
          test -n "$KAFKA_BROKERS" || { echo "Kafka broker secret is required"; exit 1; }
          test -n "$KAFKA_USERNAME" || { echo "Kafka username secret is required"; exit 1; }
          test -n "$KAFKA_PASSWORD" || { echo "Kafka password secret is required"; exit 1; }
          python3 - <<'PY'
          import hashlib
          import os

          brokers = os.environ.get("KAFKA_BROKERS", "")
          safe = brokers.replace(".", "[.]").replace(":", "[:]").replace(",", ", ")
          print(f"KAFKA_BROKERS_SANITIZED={safe}")
          print(f"KAFKA_BROKERS_SHA256={hashlib.sha256(brokers.encode()).hexdigest()}")
          PY
          case ",$KAFKA_BROKERS," in
            *,180.66.240.243:50004,*)
              echo "KAFKA_BROKERS still contains old broker endpoint 180.66.240.243:50004"
              exit 1
              ;;
            *,127.0.0.1:*|*,localhost:*|*,0.0.0.0:*|*,[::1]:*)
              echo "KAFKA_BROKERS must be a public IP/domain endpoint, not a loopback address"
              exit 1
              ;;
          esac

      - name: Validate ClickHouse settings
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
        run: |
          test -n "$CH_HOST" || { echo "ClickHouse host secret is required"; exit 1; }
          test -n "$CH_USER" || { echo "ClickHouse user secret is required"; exit 1; }
          test -n "$CH_PASSWORD" || { echo "ClickHouse password secret is required"; exit 1; }

      - name: Collect R package ecosystem
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Package_Raw
          KAFKA_CREATE_TOPIC: ${{ vars.KAFKA_CREATE_TOPIC || 'true' }}
          KAFKA_TOPIC_PARTITIONS: ${{ vars.KAFKA_TOPIC_PARTITIONS || '3' }}
          KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '1' }}
          KAFKA_WRITE_CHUNK_SIZE: ${{ vars.RPKG_KAFKA_WRITE_CHUNK_SIZE || '100' }}
          RPKG_KAFKA_TOPIC: ${{ vars.RPKG_KAFKA_TOPIC || 'rpkg.events' }}
          RPKG_JOB: ${{ steps.opts.outputs.r_package_job }}
          RPKG_CRAN_METADATA_LIMIT: ${{ vars.RPKG_CRAN_METADATA_LIMIT || '0' }}
          RPKG_DOWNLOAD_TOP: ${{ vars.RPKG_DOWNLOAD_TOP || '50' }}
          RPKG_REVERSE_DEPENDENCY_LIMIT: ${{ vars.RPKG_REVERSE_DEPENDENCY_LIMIT || '0' }}
          RPKG_CRAN_CHECK_LIMIT: ${{ vars.RPKG_CRAN_CHECK_LIMIT || '0' }}
          RPKG_CRAN_ARCHIVE_LIMIT: ${{ vars.RPKG_CRAN_ARCHIVE_LIMIT || '0' }}
          RPKG_CRAN_TASK_VIEW_LIMIT: ${{ vars.RPKG_CRAN_TASK_VIEW_LIMIT || '0' }}
          RPKG_PACKAGE_NEWS_LIMIT: ${{ vars.RPKG_PACKAGE_NEWS_LIMIT || '30' }}
          RPKG_PACKAGE_PAGE_CURSOR_MODE: ${{ vars.RPKG_PACKAGE_PAGE_CURSOR_MODE || 'clickhouse' }}
          RPKG_CRAN_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_PAGE_LIMIT || '250' }}
          RPKG_CRAN_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_CRAN_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_CRAN_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_CRAN_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_BIOCONDUCTOR_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_PAGE_LIMIT || '100' }}
          RPKG_BIOCONDUCTOR_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_BIOCONDUCTOR_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_BIOCONDUCTOR_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_RUNIVERSE_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_PAGE_LIMIT || '80' }}
          RPKG_RUNIVERSE_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_RUNIVERSE_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_RUNIVERSE_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_RUNIVERSE_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_R_WEBSITE_LIMIT: ${{ vars.RPKG_R_WEBSITE_LIMIT || '8' }}
          RPKG_R_WEBSITE_CANDIDATE_LIMIT: ${{ vars.RPKG_R_WEBSITE_CANDIDATE_LIMIT || '80' }}
          RPKG_R_WEBSITE_FEED_LIMIT: ${{ vars.RPKG_R_WEBSITE_FEED_LIMIT || '20' }}
          RPKG_R_WEBSITE_LINK_LIMIT: ${{ vars.RPKG_R_WEBSITE_LINK_LIMIT || '80' }}
          RPKG_R_WEBSITE_SITEMAP_LIMIT: ${{ vars.RPKG_R_WEBSITE_SITEMAP_LIMIT || '20' }}
          RPKG_GITHUB_LIMIT: ${{ vars.RPKG_GITHUB_LIMIT || '40' }}
          RPKG_OSV_LIMIT: ${{ vars.RPKG_OSV_LIMIT || '60' }}
          RPKG_BIBLIOMETRIC_LIMIT: ${{ vars.RPKG_BIBLIOMETRIC_LIMIT || '25' }}
          RPKG_RUNIVERSE_UNIVERSES: ${{ vars.RPKG_RUNIVERSE_UNIVERSES || 'ropensci,tidyverse' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/rproject-collector package --job "$RPKG_JOB"

      - name: Collect public R YouTube signals
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_CREATE_TOPIC: ${{ vars.KAFKA_CREATE_TOPIC || 'true' }}
          KAFKA_TOPIC_PARTITIONS: ${{ vars.KAFKA_TOPIC_PARTITIONS || '3' }}
          KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '1' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CH_DATABASE: Data_R_Community_Service
          R_YOUTUBE_KAFKA_TOPIC: ${{ vars.R_YOUTUBE_KAFKA_TOPIC || 'r.youtube.events' }}
          R_YOUTUBE_JOB: ${{ steps.opts.outputs.r_youtube_job }}
          R_YOUTUBE_SEED_LIMIT: ${{ vars.R_YOUTUBE_SEED_LIMIT || '200' }}
          R_YOUTUBE_PAGE_LIMIT: ${{ vars.R_YOUTUBE_PAGE_LIMIT || '20' }}
          R_YOUTUBE_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_VIDEO_LIMIT || '20' }}
          R_YOUTUBE_TRANSCRIPT_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_TRANSCRIPT_VIDEO_LIMIT || '3' }}
          R_YOUTUBE_TRANSCRIPT_TRACK_LIMIT: ${{ vars.R_YOUTUBE_TRANSCRIPT_TRACK_LIMIT || '1' }}
          R_YOUTUBE_TRANSCRIPT_LANGS: ${{ vars.R_YOUTUBE_TRANSCRIPT_LANGS || 'ko,en,en-US' }}
          R_YOUTUBE_COMMENT_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_COMMENT_VIDEO_LIMIT || '3' }}
          R_YOUTUBE_COMMENT_MAX_RESULTS: ${{ vars.R_YOUTUBE_COMMENT_MAX_RESULTS || '25' }}
          R_YOUTUBE_COMMENT_PAGE_LIMIT: ${{ vars.R_YOUTUBE_COMMENT_PAGE_LIMIT || '1' }}
          R_YOUTUBE_INCLUDE_COMMENT_REPLIES: ${{ vars.R_YOUTUBE_INCLUDE_COMMENT_REPLIES || 'false' }}
          R_YOUTUBE_BACKFILL_LIMIT: ${{ vars.R_YOUTUBE_BACKFILL_LIMIT || '30' }}
          R_YOUTUBE_SEARCH_EVENT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_EVENT_LIMIT || '50' }}
          R_YOUTUBE_SEARCH_QUERY_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_QUERY_LIMIT || '20' }}
          R_YOUTUBE_SEARCH_RESULT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_RESULT_LIMIT || '50' }}
          R_YOUTUBE_SEARCH_VIDEO_ENRICH_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_VIDEO_ENRICH_LIMIT || '5' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.GOOGLE_YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_ALIAS: ${{ vars.YOUTUBE_API_KEY_ALIAS || 'default' }}
          YOUTUBE_DL_BIN: yt-dlp
        run: go run ./cmd/rproject-collector youtube --job "$R_YOUTUBE_JOB"

      - name: Collect R-bloggers
        env:
          KAFKA_TOPIC: webr.events
          KAFKA_CLIENT_ID: statground-rblogger-crawler
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          TRANSLATE_ENABLED: ${{ vars.RBLOGGER_TRANSLATE_ENABLED || 'true' }}
          MAX_PAGES_FROM_HOME: ${{ vars.RBLOGGER_MAX_PAGES_FROM_HOME || '1' }}
          MAX_URLS: ${{ vars.RBLOGGER_MAX_URLS || '10' }}
          STALE_TRANSLATION_LIMIT: ${{ vars.RBLOGGER_STALE_TRANSLATION_LIMIT || '5' }}
          SLEEP_SEC: ${{ vars.RBLOGGER_SLEEP_SEC || '0.5' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.rblogger_rebuild_board }}" = "true" ]; then
            go run ./cmd/rblogger-pipeline --rebuild-board
          else
            go run ./cmd/rblogger-pipeline
          fi

      - name: Collect R Foundation public Mastodon RSS
        env:
          KAFKA_TOPIC: webr.events
          KAFKA_CLIENT_ID: statground-mastodon-rss-collector
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_CREATE_TOPIC: ${{ vars.KAFKA_CREATE_TOPIC || 'true' }}
          KAFKA_TOPIC_PARTITIONS: ${{ vars.KAFKA_TOPIC_PARTITIONS || '3' }}
          KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '1' }}
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE || 'https://fosstodon.org' }}
          MASTODON_ACCT: ${{ vars.MASTODON_ACCT || 'R_Foundation' }}
          MASTODON_LIMIT: ${{ vars.MASTODON_LIMIT || '20' }}
          MASTODON_TRANSLATE_ENABLED: ${{ vars.MASTODON_TRANSLATE_ENABLED || 'true' }}
          MASTODON_STALE_TRANSLATION_LIMIT: ${{ vars.MASTODON_STALE_TRANSLATION_LIMIT || '5' }}
          MASTODON_TRANSLATION_MODEL: ${{ vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.mastodon_backfill_board }}" = "true" ]; then
            go run ./cmd/rproject-collector mastodon --backfill-board
          else
            go run ./cmd/rproject-collector mastodon
          fi

      - name: Collect R community sources
        env:
          STATGROUND_USER_AGENT: ${{ vars.STATGROUND_USER_AGENT || 'StatgroundRCollector/1.0 (+https://www.statground.net)' }}
          R_COMMUNITY_REQUEST_DELAY: ${{ vars.R_COMMUNITY_REQUEST_DELAY || '0.5' }}
        run: |
          python scripts/collect_r_sources.py \
            --config config/r_sources.yaml \
            --out-dir data/collected/r \
            --since-days "${{ steps.opts.outputs.r_community_since_days }}" \
            --request-delay "$R_COMMUNITY_REQUEST_DELAY" \
            --log-level INFO

      - name: Show R Community collection report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/collected/r/latest_report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "item_count": report.get("item_count"),
              "error_count": report.get("error_count"),
              "top_sources": dict(list((report.get("source_counts") or {}).items())[:20]),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate R Community collection report
        env:
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
        run: |
          python scripts/validate_r_community_collection.py \
            --config config/r_sources.yaml \
            --jsonl data/collected/r/latest.jsonl \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS"

      - name: Publish R Community events to Kafka
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_CREATE_TOPIC: ${{ vars.KAFKA_CREATE_TOPIC || 'true' }}
          KAFKA_TOPIC_PARTITIONS: ${{ vars.KAFKA_TOPIC_PARTITIONS || '3' }}
          KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '1' }}
          R_COMMUNITY_KAFKA_TOPIC: ${{ vars.R_COMMUNITY_KAFKA_TOPIC || 'r.community.events' }}
          R_COMMUNITY_EVENT_LIMIT: ${{ vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || 'community:stackoverflow:r,community:posit:latest-r-filtered,reddit:r/rstats,reddit:r/rprogramming' }}
          R_COMMUNITY_TRANSLATE_ENABLED: ${{ vars.R_COMMUNITY_TRANSLATE_ENABLED || 'true' }}
          R_COMMUNITY_TRANSLATION_LIMIT: ${{ vars.R_COMMUNITY_TRANSLATION_LIMIT || vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_TRANSLATION_MODEL: ${{ vars.R_COMMUNITY_TRANSLATION_MODEL || vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR: ${{ vars.R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          go run ./cmd/rproject-collector community \
            --jsonl data/collected/r/latest.jsonl \
            --topic "$R_COMMUNITY_KAFKA_TOPIC" \
            --limit "$R_COMMUNITY_EVENT_LIMIT" \
            --translate="$R_COMMUNITY_TRANSLATE_ENABLED" \
            --translation-limit "$R_COMMUNITY_TRANSLATION_LIMIT" \
            --translation-model "$R_COMMUNITY_TRANSLATION_MODEL" \
            --fail-on-translation-error="$R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR"

      - name: Wait for R Community ClickHouse ingestion
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
        run: |
          python scripts/wait_r_community_ingestion.py source \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS" \
            --attempts 36 \
            --sleep 10

      - name: Generate R Community daily digests
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS2 }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME2 }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD2 }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_CREATE_TOPIC: ${{ vars.KAFKA_CREATE_TOPIC || 'true' }}
          KAFKA_TOPIC_PARTITIONS: ${{ vars.KAFKA_TOPIC_PARTITIONS || '3' }}
          KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '1' }}
          R_COMMUNITY_KAFKA_TOPIC: ${{ vars.R_COMMUNITY_KAFKA_TOPIC || 'r.community.events' }}
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST: ${{ vars.R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST || '80' }}
          R_COMMUNITY_DIGEST_MODEL: ${{ vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_DIGEST_MISSING_ONLY: ${{ vars.R_COMMUNITY_DIGEST_MISSING_ONLY || 'true' }}
          R_COMMUNITY_DIGEST_LATEST_PER_SOURCE: ${{ vars.R_COMMUNITY_DIGEST_LATEST_PER_SOURCE || 'true' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          go run ./cmd/rproject-collector community-digest \
            --topic "$R_COMMUNITY_KAFKA_TOPIC" \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --items-per-digest "$R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST" \
            --missing-only="$R_COMMUNITY_DIGEST_MISSING_ONLY" \
            --latest-per-source="$R_COMMUNITY_DIGEST_LATEST_PER_SOURCE" \
            --plan-output "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            | tee /tmp/r_community_digest.out

      - name: Wait for R Community daily digest visibility
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
        run: |
          python scripts/wait_r_community_ingestion.py digest \
            --digest-output /tmp/r_community_digest.out \
            --plan "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            --source-types "$R_COMMUNITY_DIGEST_SOURCE_TYPES" \
            --exclude-sources "$R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS" \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --attempts 36 \
            --sleep 10

      - name: Validate Web-R CDN2 publish settings
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
        run: |
          test -n "$STATGROUND_CDN2_ADMIN_TOKEN" || { echo "STATGROUND_CDN2_ADMIN_TOKEN secret is required"; exit 1; }
          test -n "$R_ECOSYSTEM_CONTENT_KEY" || { echo "R_ECOSYSTEM_CONTENT_KEY secret is required"; exit 1; }

      - name: Ensure Web-R CDN2 repositories
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_contents --description "Statground Web-R CDN2 R ecosystem encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_packages --description "Statground Web-R CDN2 R package encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_community --description "Statground Web-R CDN2 community encrypted content"

      - name: Checkout Web-R CDN2 contents
        uses: actions/checkout@v4
        with:
          repository: statground/web-r_CDN2_contents
          ref: main
          path: web-r_CDN2_contents
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Checkout Web-R CDN2 packages
        uses: actions/checkout@v4
        with:
          repository: statground/web-r_CDN2_packages
          ref: main
          path: web-r_CDN2_packages
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Checkout Web-R CDN2 community
        uses: actions/checkout@v4
        with:
          repository: statground/web-r_CDN2_community
          ref: main
          path: web-r_CDN2_community
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Export encrypted Web-R CDN2 content
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_DEFAULT_DATABASE: Clickhouse_Statground
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
        run: |
          python scripts/export_r_ecosystem_cdn.py --cdn-root web-r_CDN2_contents --language ko > /tmp/r_ecosystem_export.json
          python scripts/export_r_package_cdn.py --cdn-root web-r_CDN2_packages --language ko > /tmp/r_package_export.json
          python scripts/export_community_cdn.py --cdn-root web-r_CDN2_community --language ko > /tmp/community_export.json
          python - <<'PY'
          import json
          from pathlib import Path

          r_eco = json.loads(Path("/tmp/r_ecosystem_export.json").read_text(encoding="utf-8"))
          r_package = json.loads(Path("/tmp/r_package_export.json").read_text(encoding="utf-8"))
          community = json.loads(Path("/tmp/community_export.json").read_text(encoding="utf-8"))
          reports = {
              "contents": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-content",
                  "r_ecosystem": r_eco,
                  "r_ecosystem_export": int(r_eco.get("export") or 0),
                  "manifest_paths": ["contents/ko/index.json"],
              },
              "packages": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-packages",
                  "r_package": r_package,
                  "packages": int(r_package.get("packages") or 0),
                  "news": int(r_package.get("news") or 0),
                  "package_details": int(r_package.get("package_details") or 0),
                  "manifest_paths": ["packages/ko/index.json", "packages/ko/versions.json"],
              },
              "community": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-community",
                  "community": community,
                  "community_export": int(community.get("export") or 0),
                  "manifest_paths": ["community/ko/index.json"],
              },
          }
          for key, report in reports.items():
              report["item_count"] = int(report.get("r_ecosystem_export") or 0) + int(report.get("community_export") or 0) + int(report.get("packages") or 0) + int(report.get("news") or 0) + int(report.get("package_details") or 0)
              Path(f"web_r_cdn2_{key}_export_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          combined = {
              "schema": "web-r.content-cdn.export-report.v2",
              "language": "ko",
              "r_ecosystem": r_eco,
              "r_package": r_package,
              "community": community,
              "reports": reports,
          }
          Path("web_r_content_cdn_export_report.json").write_text(json.dumps(combined, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({key: report["item_count"] for key, report in reports.items()}, ensure_ascii=False))
          PY

      - name: Commit and push Web-R CDN2 contents
        id: web_r_cdn2_contents
        working-directory: web-r_CDN2_contents
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_contents.git"
          git add contents
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 contents are already up to date."
            exit 0
          fi
          git commit -m "Refresh Web-R CDN2 encrypted contents"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push Web-R CDN2 packages
        id: web_r_cdn2_packages
        working-directory: web-r_CDN2_packages
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_packages.git"
          changed=false
          git add packages/ko/index.json packages/ko/versions.json packages/ko/news
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package news"
            git push origin HEAD:main
            changed=true
          fi
          for prefix in "a-d" "e-h" "i-l" "m-p" "q-t" "u-z"; do
            git add ":(glob)packages/ko/details/[${prefix}]*.json"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "Refresh Web-R CDN2 encrypted package details ${prefix}"
            git push origin HEAD:main
            changed=true
          done
          git add packages
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package remainder"
            git push origin HEAD:main
            changed=true
          fi
          if [[ "$changed" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 packages are already up to date."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push Web-R CDN2 community
        id: web_r_cdn2_community
        working-directory: web-r_CDN2_community
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_community.git"
          git add community
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 community is already up to date."
            exit 0
          fi
          git commit -m "Refresh Web-R CDN2 encrypted community"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record Web-R CDN2 releases
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
        run: |
          python scripts/record_web_r_cdn_release.py \
            --report web_r_cdn2_contents_export_report.json \
            --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
            --repo statground/web-r_CDN2_contents \
            --branch main \
            --scope web-r-content \
            --language ko
          python scripts/record_web_r_cdn_release.py \
            --report web_r_cdn2_packages_export_report.json \
            --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
            --repo statground/web-r_CDN2_packages \
            --branch main \
            --scope web-r-packages \
            --language ko
          python scripts/record_web_r_cdn_release.py \
            --report web_r_cdn2_community_export_report.json \
            --commit-sha "${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
            --repo statground/web-r_CDN2_community \
            --branch main \
            --scope web-r-community \
            --language ko

      - name: Verify Web-R CDN2 release pointers
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
        run: |
          python scripts/verify_web_r_cdn_release.py \
            --scope web-r-content \
            --language ko \
            --repo statground/web-r_CDN2_contents \
            --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
            --manifest contents/ko/index.json
          python scripts/verify_web_r_cdn_release.py \
            --scope web-r-packages \
            --language ko \
            --repo statground/web-r_CDN2_packages \
            --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
            --manifest packages/ko/index.json
          python scripts/verify_web_r_cdn_release.py \
            --scope web-r-community \
            --language ko \
            --repo statground/web-r_CDN2_community \
            --commit-sha "${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
            --manifest community/ko/index.json
