                  "Web-R CDN2 admin pipeline release record was deferred; treating it as a failed CDN publish."
              )
          PY

      - name: Verify Web-R CDN2 admin pipeline snapshot release
        if: always() && (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn') && steps.web_r_cdn2_admin_pipelines.outcome == 'success'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN || 'false' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS || '1' }}
          WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN || 'false' }}
        run: |
          python scripts/verify_web_r_cdn_release.py \
            --scope web-r-admin-pipelines \
            --language ko \
            --repo statground/web-r_CDN2 \
            --commit-sha "${{ steps.web_r_cdn2_admin_pipelines.outputs.commit_sha }}" \
            --manifest admin/pipelines/latest.json

      - name: Mark deferred CDN exports as degraded
        if: always() && (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "contents": ("web_r_cdn2_contents_export_report.json", "r_ecosystem"),
              "packages": ("web_r_cdn2_packages_export_report.json", "r_package"),
          }
          deferred = []
          for scope, (path, key) in checks.items():
              report_path = Path(path)
              if not report_path.exists():
                  deferred.append(f"{scope}:report_missing")
                  continue
              payload = json.loads(report_path.read_text(encoding="utf-8"))
              result = payload.get(key) or {}
              if result.get("export_deferred"):
                  deferred.append(f"{scope}:{result.get('deferred_reason') or 'deferred'}")
          release_records = {
              "contents": "/tmp/web_r_cdn_record_contents.json",
              "packages": "/tmp/web_r_cdn_record_packages.json",
          }
          for scope, path in release_records.items():
              record_path = Path(path)
              if not record_path.exists():
                  deferred.append(f"{scope}:release_record_missing")
                  continue
              record = json.loads(record_path.read_text(encoding="utf-8"))
              if record.get("record_deferred") or record.get("record_skipped"):
                  deferred.append(
                      f"{scope}:{record.get('deferred_reason') or record.get('reason') or 'release_record_incomplete'}"
                  )
          if deferred:
              summary = "CDN publish degraded: " + ", ".join(deferred)
              print(f"::error::{summary}")
              summary_path = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
              summary_path.write_text("## CDN publish degraded\n\n" + summary + "\n", encoding="utf-8")
              raise SystemExit(1)
          print("All CDN export scopes produced fresh reports.")
          PY

  community-publication:
    name: Publish exact Web-R community generation
    needs: collect
    if: inputs.scope == 'all' || inputs.scope == 'cdn'
    runs-on:
      group: statground-internal
      labels: [self-hosted, linux, x64]
    environment: web-r-community-publication
    timeout-minutes: 45
    env:
      STATGROUND_SQL_COMMIT_SHA: 6ee7206c13d6694de1d1ef6bf95b3f6b2b7a7022
      CLICKHOUSE_CLIENT_VERSION: 26.1.2.11
      CLICKHOUSE_CLIENT_SHA512: 10a8e6bf05ddbbfeeedbf6fae7050b84e0104962a0ab8bf324b8bd83bf779fb87c00602e3660dc462d01b91b9f53c530498be32ba652e13a01cf86fd3edc33cc
      CLICKHOUSE_COMMON_STATIC_SHA512: cdcb883b3ea3632434da3014bd8bca00a0ba1a5a50571fe14bddbf859ce31da3c43306e3bcee66185276cf8c05f4743730d2751dd6a86ac9ec6494d77f9cc0fb
    steps:
      - name: Define community publication runtime path
        env:
          RUNTIME_NAME: webr-community-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          for stale in runner_temp.glob("webr-community-*"):
              metadata = stale.lstat()
              if stat.S_ISLNK(metadata.st_mode) or metadata.st_uid != os.geteuid() or not stale.is_dir():
                  raise SystemExit("refusing unsafe stale community runtime cleanup")
              shutil.rmtree(stale)
          runtime = runner_temp / os.environ["RUNTIME_NAME"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"COMMUNITY_RUNTIME_DIR={runtime}", file=output)
          PY

      - name: Checkout R Project publication source
        uses: actions/checkout@v7

      - name: Checkout immutable Statground SQL publisher
        uses: actions/checkout@v7
        with:
          repository: statground/Statground_SQL
          ref: 6ee7206c13d6694de1d1ef6bf95b3f6b2b7a7022
          path: statground-sql
          token: ${{ secrets.STATGROUND_SQL_READ_TOKEN }}
          persist-credentials: false

      - name: Verify immutable Statground SQL checkout
        run: |
          test "$(git -C statground-sql rev-parse HEAD)" = "$STATGROUND_SQL_COMMIT_SHA" || {
            echo "Statground_SQL checkout differs from the pinned publication contract" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install community exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Validate protected publication settings
        env:
          STATGROUND_SQL_READ_TOKEN: ${{ secrets.STATGROUND_SQL_READ_TOKEN }}
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
          WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64: ${{ secrets.WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64 }}
          WEBR_COMMUNITY_READER_INVENTORY_B64: ${{ secrets.WEBR_COMMUNITY_READER_INVENTORY_B64 }}
          WEBR_COMMUNITY_READER_TOKENS_B64: ${{ secrets.WEBR_COMMUNITY_READER_TOKENS_B64 }}
        run: |
          test -n "$STATGROUND_SQL_READ_TOKEN" || { echo "STATGROUND_SQL_READ_TOKEN is required" >&2; exit 1; }
          test -n "$STATGROUND_CDN2_ADMIN_TOKEN" || { echo "STATGROUND_CDN2_ADMIN_TOKEN is required" >&2; exit 1; }
          test -n "$R_ECOSYSTEM_CONTENT_KEY" || { echo "R_ECOSYSTEM_CONTENT_KEY is required" >&2; exit 1; }
          test -n "$WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64" || { echo "WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64 is required" >&2; exit 1; }
          test -n "$WEBR_COMMUNITY_READER_INVENTORY_B64" || { echo "WEBR_COMMUNITY_READER_INVENTORY_B64 is required" >&2; exit 1; }
          test -n "$WEBR_COMMUNITY_READER_TOKENS_B64" || { echo "WEBR_COMMUNITY_READER_TOKENS_B64 is required" >&2; exit 1; }

      - name: Materialize owner-only community publication runtime
        env:
          WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64: ${{ secrets.WEBR_COMMUNITY_CLICKHOUSE_CONFIGS_B64 }}
          WEBR_COMMUNITY_READER_INVENTORY_B64: ${{ secrets.WEBR_COMMUNITY_READER_INVENTORY_B64 }}
          WEBR_COMMUNITY_READER_TOKENS_B64: ${{ secrets.WEBR_COMMUNITY_READER_TOKENS_B64 }}
        run: |
          python scripts/materialize_community_publication_runtime.py \
            --runtime-dir "$COMMUNITY_RUNTIME_DIR" \
            --runner-temp "$RUNNER_TEMP"
          test "$(stat -c '%a' "$COMMUNITY_RUNTIME_DIR")" = 700
          if find "$COMMUNITY_RUNTIME_DIR" -type f ! -perm 0600 -print -quit | grep -q .; then
            echo "community publication secret files are not owner-only" >&2
            exit 1
          fi

      - name: Install checksum-pinned ClickHouse client
        run: |
          client_root="$COMMUNITY_RUNTIME_DIR/clickhouse-client"
          archive_root="$COMMUNITY_RUNTIME_DIR/clickhouse-archives"
          mkdir -m 700 "$client_root" "$archive_root"
          client_archive="$archive_root/clickhouse-client.tgz"
          common_archive="$archive_root/clickhouse-common-static.tgz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
            --output "$client_archive" \
            "https://packages.clickhouse.com/tgz/stable/clickhouse-client-${CLICKHOUSE_CLIENT_VERSION}-amd64.tgz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
            --output "$common_archive" \
            "https://packages.clickhouse.com/tgz/stable/clickhouse-common-static-${CLICKHOUSE_CLIENT_VERSION}-amd64.tgz"
          printf '%s  %s\n' "$CLICKHOUSE_CLIENT_SHA512" "$client_archive" | sha512sum --check --strict
          printf '%s  %s\n' "$CLICKHOUSE_COMMON_STATIC_SHA512" "$common_archive" | sha512sum --check --strict
          tar --extract --gzip --file "$client_archive" --directory "$archive_root"
          tar --extract --gzip --file "$common_archive" --directory "$archive_root"
          mkdir -m 700 "$client_root/bin"
          install -m 0755 \
            "$archive_root/clickhouse-common-static-${CLICKHOUSE_CLIENT_VERSION}/usr/bin/clickhouse" \
            "$client_root/bin/clickhouse"
          ln -s clickhouse "$client_root/bin/clickhouse-client"
          "$client_root/bin/clickhouse-client" --version

      - name: Gate exact community publication write targets
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CLICKHOUSE_PRESSURE_GATE_TARGETS: >-
            local:mart_webr.community_feed_snapshot_v1_local,
            local:mart_webr.community_feed_generation_proof_v1_local,
            replica:mart_webr.community_feed_publish_lease_v1_local,
            replica:mart_webr.community_feed_generation_marker_v1_local,
            replica:mart_webr.community_feed_serving_pointer_v1_local,
            replica:mart_webr.community_publication_reader_transition_ack_v2_local
        run: python scripts/clickhouse_pressure_gate.py

      - name: Checkout Web-R CDN2 community
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_community
          ref: main
          path: web-r_CDN2_community
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Preflight and load exact community generation
        id: community_loader
        run: |
          client="$COMMUNITY_RUNTIME_DIR/clickhouse-client/bin/clickhouse-client"
          loader="statground-sql/docker-compose/50005_Clickhouse_Statground/webr_community_generation_loader.py"
          endpoints=(
            --endpoint "s1r1=$COMMUNITY_RUNTIME_DIR/endpoints/s1r1.xml"
            --endpoint "s1r2=$COMMUNITY_RUNTIME_DIR/endpoints/s1r2.xml"
            --endpoint "s2r1=$COMMUNITY_RUNTIME_DIR/endpoints/s2r1.xml"
            --endpoint "s2r2=$COMMUNITY_RUNTIME_DIR/endpoints/s2r2.xml"
          )
          preflight_generation="$("$client" --config-file "$COMMUNITY_RUNTIME_DIR/endpoints/s1r1.xml" \
            --query "SELECT toString(now64(6, 'UTC')) FORMAT TSVRaw")"
          python "$loader" preflight --generation "$preflight_generation" \
            --clickhouse-client "$client" "${endpoints[@]}" \
            > "$COMMUNITY_RUNTIME_DIR/loader-preflight.json"
          generation="$("$client" --config-file "$COMMUNITY_RUNTIME_DIR/endpoints/s1r1.xml" \
            --query "SELECT toString(now64(6, 'UTC')) FORMAT TSVRaw")"
          test "$generation" != "$preflight_generation" || {
            echo "ClickHouse did not provide a fresh exact generation" >&2
            exit 1
          }
          python "$loader" load --generation "$generation" \
            --clickhouse-client "$client" "${endpoints[@]}" \
            > "$COMMUNITY_RUNTIME_DIR/loader-receipt.json"
          GENERATION="$generation" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ["COMMUNITY_RUNTIME_DIR"]) / "loader-receipt.json").read_text(encoding="utf-8"))
          if (
              receipt.get("status") != "candidate_loaded"
              or receipt.get("generation") != os.environ["GENERATION"]
              or int(receipt.get("row_count") or 0) <= 0
              or int(receipt.get("visible_row_count") or 0) <= 0
              or int(receipt.get("cdn_item_count") or 0) <= 0
              or len(str(receipt.get("cdn_identity_hash") or "")) != 64
          ):
              raise SystemExit("exact community generation loader receipt is incomplete")
          PY
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Export the exact loaded community generation
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CLICKHOUSE_DEFAULT_DATABASE: Clickhouse_Statground
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
          WEBR_COMMUNITY_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.WEBR_COMMUNITY_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          WEBR_COMMUNITY_CDN_HTTP_TIMEOUT: ${{ vars.WEBR_COMMUNITY_CDN_HTTP_TIMEOUT || '150' }}
          WEBR_COMMUNITY_CDN_CH_MAX_THREADS: ${{ vars.WEBR_COMMUNITY_CDN_CH_MAX_THREADS || '2' }}
          WEBR_COMMUNITY_CDN_EXPORT_TRANSIENT_FAIL_OPEN: "false"
          GENERATION: ${{ steps.community_loader.outputs.generation }}
        run: |
          python scripts/test_export_community_cdn.py
          python scripts/export_community_cdn.py \
            --cdn-root web-r_CDN2_community \
            --language ko \
            --generation "${{ steps.community_loader.outputs.generation }}" \
            > "$COMMUNITY_RUNTIME_DIR/community-export.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          generation = os.environ["GENERATION"]
          report = json.loads((Path(os.environ["COMMUNITY_RUNTIME_DIR"]) / "community-export.json").read_text(encoding="utf-8"))
          proof = json.loads(Path("web-r_CDN2_community/community/ko/generation-proof.json").read_text(encoding="utf-8"))
          hashes = re.compile(r"[0-9a-f]{64}")
          if report.get("export_deferred") or report.get("generation") != generation or report.get("generation_complete") is not True:
              raise SystemExit("community export did not complete the exact loader generation")
          if (
              report.get("workshop_complete") is not True
              or int(report.get("workshop_item_count") or 0) <= 0
              or int(report.get("workshop_post_count") or 0) <= 0
              or int(report.get("workshop_export") or 0) != int(report.get("workshop_item_count") or 0)
              or not hashes.fullmatch(str(report.get("workshop_identity_hash") or ""))
              or not hashes.fullmatch(str(report.get("workshop_content_hash") or ""))
              or report.get("workshop_catalog_token") != report.get("workshop_content_hash")
          ):
              raise SystemExit("workshop export is incomplete")
          if (
              proof.get("schema") != "web-r.community.generation-proof.v2"
              or proof.get("generation") != generation
              or proof.get("complete") is not True
              or int(proof.get("item_count") or 0) <= 0
              or not hashes.fullmatch(str(proof.get("identity_hash") or ""))
              or not hashes.fullmatch(str(proof.get("content_hash") or ""))
          ):
              raise SystemExit("community generation proof is incomplete")
          PY

      - name: Commit and push exact Web-R community generation
        id: web_r_cdn2_community
        working-directory: web-r_CDN2_community
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          askpass="$COMMUNITY_RUNTIME_DIR/git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$STATGROUND_CDN2_ADMIN_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 0700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git remote set-url origin "https://github.com/statground/web-r_CDN2_community.git"
          git add community
          if git diff --cached --quiet; then
            echo "exact community generation produced no CDN commit" >&2
            exit 1
          fi
          git commit -m "Publish exact Web-R community generation"
          git -c credential.helper= push origin HEAD:main
          commit_sha="$(git rev-parse HEAD)"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid community commit identity" >&2; exit 1; }
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Verify immutable jsDelivr generation proof
        run: |
          python scripts/verify_community_generation_cdn.py \
            --base-url "https://cdn.jsdelivr.net/gh/statground/web-r_CDN2_community@${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
            --proof web-r_CDN2_community/community/ko/generation-proof.json \
            --asset community/ko/index.json web-r_CDN2_community/community/ko/index.json \
            --asset community/ko/workshop/index.json web-r_CDN2_community/community/ko/workshop/index.json \
            --attempts 8 \
            --backoff-seconds 5

      - name: Preflight exact application reader transition
        id: community_preflight
        run: |
          client="$COMMUNITY_RUNTIME_DIR/clickhouse-client/bin/clickhouse-client"
          publisher="statground-sql/docker-compose/50005_Clickhouse_Statground/webr_community_generation_publisher.py"
          endpoints=(
            --endpoint "s1r1=$COMMUNITY_RUNTIME_DIR/endpoints/s1r1.xml"
            --endpoint "s1r2=$COMMUNITY_RUNTIME_DIR/endpoints/s1r2.xml"
            --endpoint "s2r1=$COMMUNITY_RUNTIME_DIR/endpoints/s2r1.xml"
            --endpoint "s2r2=$COMMUNITY_RUNTIME_DIR/endpoints/s2r2.xml"
          )
          python "$publisher" preflight \
            --generation "${{ steps.community_loader.outputs.generation }}" \
            --cdn-proof web-r_CDN2_community/community/ko/generation-proof.json \
            --cdn-base-url "https://cdn.jsdelivr.net/gh/statground/web-r_CDN2_community@${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
            --reader-inventory "$COMMUNITY_RUNTIME_DIR/reader-inventory.json" \
            --clickhouse-client "$client" "${endpoints[@]}" \
            > "$COMMUNITY_RUNTIME_DIR/publisher-preflight.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ["COMMUNITY_RUNTIME_DIR"]) / "publisher-preflight.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "preflight_pass" or int(receipt.get("reader_count") or 0) <= 0:
              raise SystemExit("community publisher preflight receipt is incomplete")
          if receipt.get("current_generation") is None:
              raise SystemExit("bootstrap_required: dispatch R Project Community Bootstrap")
          PY

      - name: Publish and reopen exact application readers
        run: |
          client="$COMMUNITY_RUNTIME_DIR/clickhouse-client/bin/clickhouse-client"
          publisher="statground-sql/docker-compose/50005_Clickhouse_Statground/webr_community_generation_publisher.py"
          endpoints=(
            --endpoint "s1r1=$COMMUNITY_RUNTIME_DIR/endpoints/s1r1.xml"
            --endpoint "s1r2=$COMMUNITY_RUNTIME_DIR/endpoints/s1r2.xml"
            --endpoint "s2r1=$COMMUNITY_RUNTIME_DIR/endpoints/s2r1.xml"
            --endpoint "s2r2=$COMMUNITY_RUNTIME_DIR/endpoints/s2r2.xml"
          )
          python "$publisher" publish \
            --generation "${{ steps.community_loader.outputs.generation }}" \
            --cdn-proof web-r_CDN2_community/community/ko/generation-proof.json \
            --cdn-base-url "https://cdn.jsdelivr.net/gh/statground/web-r_CDN2_community@${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
            --reader-inventory "$COMMUNITY_RUNTIME_DIR/reader-inventory.json" \
            --reader-timeout-seconds 60 \
            --clickhouse-client "$client" "${endpoints[@]}" \
            > "$COMMUNITY_RUNTIME_DIR/community-publish-receipt.json"
          python - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          receipt = json.loads((Path(os.environ["COMMUNITY_RUNTIME_DIR"]) / "community-publish-receipt.json").read_text(encoding="utf-8"))
          expected_generation = "${{ steps.community_loader.outputs.generation }}"
          if (
              receipt.get("status") not in {"released", "already_released"}
              or receipt.get("generation") != expected_generation
              or int(receipt.get("reader_count") or 0) <= 0
              or receipt.get("withdrawal_ack") is not True
              or int(receipt.get("fence_token") or 0) <= 0
          ):
              raise SystemExit("community publication receipt is incomplete")
          for key in ("transition_id", "ack_uuid"):
              value = uuid.UUID(str(receipt.get(key) or ""))
              if value.int == 0 or str(value) != receipt[key]:
                  raise SystemExit(f"community publication receipt has invalid {key}")
          if receipt["status"] == "released":
              for key in ("marker_id", "pointer_id"):
                  value = uuid.UUID(str(receipt.get(key) or ""))
                  if value.int == 0 or str(value) != receipt[key]:
                      raise SystemExit(f"community publication receipt has invalid {key}")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Always remove community publication secrets
        if: always()
        run: |
          RUNTIME_DIR="$COMMUNITY_RUNTIME_DIR" python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          runtime = Path(os.environ["RUNTIME_DIR"])
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          if runtime.parent.resolve(strict=True) != runner_temp:
              raise SystemExit("refusing to clean a path outside RUNNER_TEMP")
          if runtime.exists() and not runtime.is_symlink():
              shutil.rmtree(runtime)
          if runtime.exists() or runtime.is_symlink():
              raise SystemExit("community publication runtime cleanup failed")
          PY
