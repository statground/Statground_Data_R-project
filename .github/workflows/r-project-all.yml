name: R Project Data Collection Worker

on:
  workflow_call:
    inputs:
      scope:
        description: "Worker scope: all, package, social, community, community-digest, notebook, or cdn"
        required: false
        type: string
        default: "all"
      r_package_job:
        description: "R Package Ecosystem jobs: all or comma-separated jobs"
        required: false
        type: string
        default: "all"
      r_package_reverse_shard_count:
        description: "Number of stable CRAN reverse dependency shards"
        required: false
        type: string
        default: "1"
      r_package_reverse_shard_index:
        description: "Zero-based CRAN reverse dependency shard index"
        required: false
        type: string
        default: "0"
      r_youtube_job:
        description: "R YouTube jobs: all, seeds, pages, search, links, videos, transcripts, comments, or backfill-metadata"
        required: false
        type: string
        default: "all"
      rblogger_rebuild_board:
        description: "Retranslate all active R-Blogger raw rows into board"
        required: false
        type: string
        default: "false"
      mastodon_backfill_board:
        description: "Translate missing or fallback Mastodon board rows only"
        required: false
        type: string
        default: "false"
      r_community_since_days:
        description: "Only keep R Community items newer than N days when published_at exists. Use -1 for no date filtering."
        required: false
        type: string
        default: "7"
      webr_notebook_date:
        description: "Web-R Notebook series date in Asia/Seoul, YYYY-MM-DD. Empty means today."
        required: false
        type: string
        default: ""
      webr_notebook_force_new:
        description: "Create another Web-R Notebook post even when today's generated post already exists."
        required: false
        type: string
        default: "false"
      webr_notebook_dry_run:
        description: "Run webR and build the notebook row without inserting it."
        required: false
        type: string
        default: "false"
      webr_notebook_count:
        description: "Number of distinct Notebook posts to generate in this run (1-5)"
        required: false
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      scope:
        description: "Worker scope: all, package, social, community, community-digest, notebook, or cdn"
        required: false
        default: "all"
      r_package_job:
        description: "R Package Ecosystem jobs: all or comma-separated jobs"
        required: false
        default: "all"
      r_youtube_job:
        description: "R YouTube jobs: all, seeds, pages, search, links, videos, transcripts, comments, or backfill-metadata"
        required: false
        default: "all"
      rblogger_rebuild_board:
        description: "Retranslate all active R-Blogger raw rows into board"
        required: false
        default: "false"
      mastodon_backfill_board:
        description: "Translate missing or fallback Mastodon board rows only"
        required: false
        default: "false"
      r_community_since_days:
        description: "Only keep R Community items newer than N days when published_at exists. Use -1 for no date filtering."
        required: false
        default: "14"
      webr_notebook_date:
        description: "Web-R Notebook series date in Asia/Seoul, YYYY-MM-DD. Empty means today."
        required: false
        default: ""
      webr_notebook_force_new:
        description: "Create another Web-R Notebook post even when today's generated post already exists."
        required: false
        default: "false"
      webr_notebook_dry_run:
        description: "Run webR and build the notebook row without inserting it."
        required: false
        default: "false"
      webr_notebook_count:
        description: "Number of distinct Notebook posts to generate in this run (1-5)"
        required: false
        default: "1"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  RPROJECT_PUBLISH_MODE: ${{ vars.RPROJECT_PUBLISH_MODE || 'clickhouse' }}
  CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_BYTES: "107374182400"
  CLICKHOUSE_PRESSURE_GATE_MAX_USED_RATIO: "0.90"
  CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_INODES: "1000000"
  CLICKHOUSE_PRESSURE_GATE_MAX_USED_INODE_RATIO: "0.95"
  CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_QUEUE: "2000"
  CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_DELAY_SECONDS: "900"
  CLICKHOUSE_PRESSURE_GATE_MAX_IOWAIT_NORMALIZED: "0.50"
  CLICKHOUSE_PRESSURE_GATE_TIMEOUT_SECONDS: "15"

concurrency:
  group: r-project-${{ inputs.scope || 'all' }}-${{ inputs.r_package_job || 'default' }}-${{ inputs.r_package_reverse_shard_index || '0' }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Set run options
        id: opts
        run: |
          scope="${{ inputs.scope || 'all' }}"
          case "$scope" in
            all|package|social|community|community-digest|notebook|cdn) ;;
            *)
              echo "Unsupported R Project workflow scope: $scope"
              exit 1
              ;;
          esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "r_package_job=${{ inputs.r_package_job || vars.RPKG_JOB || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "r_package_reverse_shard_count=${{ inputs.r_package_reverse_shard_count || '1' }}" >> "$GITHUB_OUTPUT"
          echo "r_package_reverse_shard_index=${{ inputs.r_package_reverse_shard_index || '0' }}" >> "$GITHUB_OUTPUT"
          echo "r_youtube_job=${{ inputs.r_youtube_job || vars.R_YOUTUBE_JOB || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "rblogger_rebuild_board=${{ inputs.rblogger_rebuild_board || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "mastodon_backfill_board=${{ inputs.mastodon_backfill_board || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "r_community_since_days=${{ inputs.r_community_since_days || vars.R_COMMUNITY_SINCE_DAYS || '7' }}" >> "$GITHUB_OUTPUT"
          echo "webr_notebook_date=${{ inputs.webr_notebook_date || '' }}" >> "$GITHUB_OUTPUT"
          echo "webr_notebook_force_new=${{ inputs.webr_notebook_force_new || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "webr_notebook_dry_run=${{ inputs.webr_notebook_dry_run || 'false' }}" >> "$GITHUB_OUTPUT"
          count="${{ inputs.webr_notebook_count || '1' }}"
          [[ "$count" =~ ^[1-5]$ ]] || { echo "webr_notebook_count must be between 1 and 5"; exit 1; }
          echo "webr_notebook_count=$count" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'package' || steps.opts.outputs.scope == 'social' || steps.opts.outputs.scope == 'community' || steps.opts.outputs.scope == 'community-digest'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v6
        if: steps.opts.outputs.scope != 'package'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v6
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'notebook'
        with:
          node-version: "22"

      - name: Validate Go collector packages
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'package' || steps.opts.outputs.scope == 'social' || steps.opts.outputs.scope == 'community' || steps.opts.outputs.scope == 'community-digest'
        run: go test ./cmd/rproject-collector ./cmd/rblogger-pipeline

      - name: Install Python collector dependencies
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community' || steps.opts.outputs.scope == 'notebook' || steps.opts.outputs.scope == 'cdn'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Install webR for Node
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'notebook'
        run: npm install --no-save webr

      - name: Install yt-dlp metadata fallback
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'social'
        run: |
          python -m pip install --user yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Web-R Notebook style templates
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'notebook'
        run: |
          python scripts/generate_webr_notebook_daily.py \
            --runner scripts/webr_notebook_runner.mjs \
            --validate-style-templates \
            --output /tmp/webr_notebook_style_validation.json

      - name: Validate ClickHouse settings
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
        run: |
          test -n "$CH_HOST" || { echo "ClickHouse host secret is required"; exit 1; }
          test -n "$CH_USER" || { echo "ClickHouse user secret is required"; exit 1; }
          test -n "$CH_PASSWORD" || { echo "ClickHouse password secret is required"; exit 1; }
          if [[ "${CH_SECURE,,}" != "true" && "$CH_SECURE" != "1" ]]; then
            echo "::warning::ClickHouse transport is not TLS-protected; provision a verified HTTPS endpoint and set CH_SECURE=true"
          fi

      - name: Gate ClickHouse writes on storage pressure
        if: steps.opts.outputs.scope != 'notebook' || steps.opts.outputs.webr_notebook_dry_run != 'true'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
        run: |
          package_targets="replica:Data_R_Package_Raw.r_package_event_raw_local,\
          replica:Data_R_Package_Raw.bibliometric_mention_raw_local,\
          replica:Data_R_Package_Raw.cran_archive_raw_local,\
          replica:Data_R_Package_Raw.cran_check_raw_local,\
          replica:Data_R_Package_Raw.cran_download_daily_raw_local,\
          replica:Data_R_Package_Raw.cran_package_artifact_raw_local,\
          replica:Data_R_Package_Raw.cran_package_manual_topic_raw_local,\
          replica:Data_R_Package_Raw.cran_package_page_raw_local,\
          replica:Data_R_Package_Raw.cran_package_snapshot_raw_local,\
          replica:Data_R_Package_Raw.cran_task_view_package_edge_raw_local,\
          replica:Data_R_Package_Raw.cran_task_view_snapshot_raw_local,\
          replica:Data_R_Package_Raw.github_repo_snapshot_raw_local,\
          replica:Data_R_Package_Raw.package_dependency_edge_raw_local,\
          replica:Data_R_Package_Raw.r_core_release_note_raw_local,\
          replica:Data_R_Package_Raw.r_website_candidate_raw_local,\
          replica:Data_R_Package_Raw.r_website_feed_discovery_raw_local,\
          replica:Data_R_Package_Raw.r_website_feed_item_raw_local,\
          replica:Data_R_Package_Raw.r_website_fetch_raw_local,\
          replica:Data_R_Package_Raw.r_website_link_edge_raw_local,\
          replica:Data_R_Package_Raw.r_website_package_mention_raw_local,\
          replica:Data_R_Package_Raw.r_website_sitemap_url_raw_local,\
          replica:Data_R_Package_Raw.security_osv_snapshot_raw_local,\
          replica:Data_R_Package_Service.package_bibliometric_current_local,\
          replica:Data_R_Package_Service.package_cran_artifact_current_local,\
          replica:Data_R_Package_Service.package_cran_check_current_local,\
          replica:Data_R_Package_Service.package_cran_manual_topic_current_local,\
          replica:Data_R_Package_Service.package_cran_page_by_name_current_local,\
          replica:Data_R_Package_Service.package_cran_page_current_local,\
          replica:Data_R_Package_Service.package_current_local,\
          replica:Data_R_Package_Service.package_dependency_edge_current_local,\
          replica:Data_R_Package_Service.package_dependency_from_current_local,\
          replica:Data_R_Package_Service.package_document_artifact_current_local,\
          replica:Data_R_Package_Service.package_document_manual_topic_current_local,\
          replica:Data_R_Package_Service.package_download_daily_local,\
          replica:Data_R_Package_Service.package_github_repo_current_local,\
          replica:Data_R_Package_Service.package_lifecycle_current_local,\
          replica:Data_R_Package_Service.package_security_osv_current_local,\
          replica:Data_R_Package_Service.package_version_history_local,\
          replica:Data_R_Package_Service.r_website_current_local"
          social_targets="replica:Data_R_Community_Raw.r_youtube_event_raw_local,\
          replica:Data_R_Community_Raw.r_youtube_source_seed_raw_local,\
          replica:Data_R_Community_Raw.r_youtube_video_snapshot_raw_local,\
          replica:Data_R_Community_Raw.r_youtube_transcript_segment_raw_local,\
          replica:Data_R_Community_Raw.r_youtube_comment_thread_raw_local,\
          replica:Data_R_Community_Raw.r_youtube_package_mention_raw_local,\
          replica:Data_R_Community_Log.api_quota_ledger_local,\
          replica:Data_R_Community_Service.crawl_cursor_current_local,\
          replica:Data_R_Community_Service.r_youtube_source_seed_current_local,\
          replica:Data_R_Community_Service.r_youtube_video_current_local,\
          replica:Data_R_Community_Service.r_youtube_package_mention_current_local,\
          replica:Data_R_Community_Log.r_blogger_log_local,\
          replica:Data_R_Community_Raw.r_blogger_article_raw_local,\
          replica:Data_R_Community_Service.r_blogger_board_local,\
          replica:Data_R_Community_Log.mastodon_log_local,\
          replica:Data_R_Community_Raw.mastodon_status_raw_local,\
          replica:Data_R_Community_Service.mastodon_board_local"
          community_targets="replica:Data_R_Community_Raw.r_community_event_raw_local,\
          replica:Data_R_Community_Raw.r_community_item_raw_local,\
          replica:Data_R_Community_Raw.community_dcinside_post_raw_local,\
          replica:Data_R_Community_Raw.community_html_link_raw_local,\
          replica:Data_R_Community_Raw.community_mastodon_item_raw_local,\
          replica:Data_R_Community_Raw.community_reddit_post_raw_local,\
          replica:Data_R_Community_Raw.community_release_note_raw_local,\
          replica:Data_R_Community_Raw.community_rss_item_raw_local,\
          replica:Data_R_Community_Service.r_community_daily_digest_local,\
          replica:Data_R_Community_Service.r_community_item_current_local,\
          replica:Data_R_Community_Service.r_community_item_read_current_local,\
          replica:Data_R_Community_Service.r_community_source_current_local,\
          replica:Data_R_Community_Mart.r_community_source_daily_local"
          digest_target="replica:Data_R_Community_Service.r_community_daily_digest_local"
          notebook_target="replica:webr_webr.notebook_local"
          cdn_target="replica:Data_R_Community_Service.web_r_cdn_release_log_local"
          outbox_target="local:Data_R_Community_Log.r_project_direct_insert_outbox"
          case "${{ steps.opts.outputs.scope }}" in
            all) CLICKHOUSE_PRESSURE_GATE_TARGETS="${package_targets},${social_targets},${community_targets},${notebook_target},${cdn_target},${outbox_target}" ;;
            package) CLICKHOUSE_PRESSURE_GATE_TARGETS="${package_targets},${outbox_target}" ;;
            social) CLICKHOUSE_PRESSURE_GATE_TARGETS="${social_targets},${outbox_target}" ;;
            community) CLICKHOUSE_PRESSURE_GATE_TARGETS="${community_targets},${outbox_target}" ;;
            community-digest) CLICKHOUSE_PRESSURE_GATE_TARGETS="${digest_target},${outbox_target}" ;;
            notebook) CLICKHOUSE_PRESSURE_GATE_TARGETS="${notebook_target}" ;;
            cdn) CLICKHOUSE_PRESSURE_GATE_TARGETS="${cdn_target}" ;;
            *) echo "Unsupported pressure-gate scope"; exit 1 ;;
          esac
          export CLICKHOUSE_PRESSURE_GATE_TARGETS
          python3 scripts/clickhouse_pressure_gate.py

      - name: Collect R package ecosystem
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'package'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CH_DATABASE: Data_R_Package_Raw
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ steps.opts.outputs.r_package_job == 'cran-reverse-dependencies' && (vars.RPKG_REVERSE_DEPENDENCY_CLICKHOUSE_CHUNK_SIZE || '500') || steps.opts.outputs.r_package_job == 'cran-archive' && (vars.RPKG_CRAN_ARCHIVE_CLICKHOUSE_CHUNK_SIZE || '500') || steps.opts.outputs.r_package_job == 'cran-task-views' && (vars.RPKG_CRAN_TASK_VIEW_CLICKHOUSE_CHUNK_SIZE || '250') || (vars.RPROJECT_CLICKHOUSE_CHUNK_SIZE || '50') }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.RPROJECT_CLICKHOUSE_ATTEMPTS || '3' }}
          RPROJECT_CLICKHOUSE_INSERT_DISTRIBUTED_SYNC: "true"
          RPROJECT_DIRECT_OUTBOX_DRAIN_LIMIT: ${{ vars.RPKG_DIRECT_OUTBOX_DRAIN_LIMIT || '10' }}
          RPKG_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.RPKG_PUBLISH_TRANSIENT_FAIL_OPEN || 'true' }}
          RPKG_JOB_TIMEOUT_SECONDS: ${{ vars.RPKG_JOB_TIMEOUT_SECONDS || '7200' }}
          RPKG_SKIP_UNCHANGED_METADATA: ${{ vars.RPKG_SKIP_UNCHANGED_METADATA || 'true' }}
          RPKG_JOB: ${{ steps.opts.outputs.r_package_job }}
          RPKG_CRAN_METADATA_LIMIT: ${{ vars.RPKG_CRAN_METADATA_LIMIT || '0' }}
          RPKG_DOWNLOAD_TOP: ${{ vars.RPKG_DOWNLOAD_TOP || '50' }}
          RPKG_REVERSE_DEPENDENCY_LIMIT: ${{ vars.RPKG_REVERSE_DEPENDENCY_LIMIT || '0' }}
          RPKG_REVERSE_DEPENDENCY_SHARD_COUNT: ${{ steps.opts.outputs.r_package_reverse_shard_count }}
          RPKG_REVERSE_DEPENDENCY_SHARD_INDEX: ${{ steps.opts.outputs.r_package_reverse_shard_index }}
          RPKG_CRAN_CHECK_LIMIT: ${{ vars.RPKG_CRAN_CHECK_LIMIT || '0' }}
          RPKG_CRAN_ARCHIVE_LIMIT: ${{ vars.RPKG_CRAN_ARCHIVE_LIMIT || '0' }}
          RPKG_CRAN_TASK_VIEW_LIMIT: ${{ vars.RPKG_CRAN_TASK_VIEW_LIMIT || '0' }}
          RPKG_PACKAGE_NEWS_LIMIT: ${{ vars.RPKG_PACKAGE_NEWS_LIMIT || '30' }}
          RPKG_PACKAGE_PAGE_CURSOR_MODE: ${{ vars.RPKG_PACKAGE_PAGE_CURSOR_MODE || 'clickhouse' }}
          RPKG_CRAN_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_PAGE_LIMIT || '250' }}
          RPKG_CRAN_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_CRAN_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_CRAN_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_CRAN_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_CRAN_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_BIOCONDUCTOR_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_PAGE_LIMIT || '100' }}
          RPKG_BIOCONDUCTOR_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_BIOCONDUCTOR_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_BIOCONDUCTOR_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_BIOCONDUCTOR_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_RUNIVERSE_PACKAGE_PAGE_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_PAGE_LIMIT || '80' }}
          RPKG_RUNIVERSE_PACKAGE_PAGE_PACKAGES: ${{ vars.RPKG_RUNIVERSE_PACKAGE_PAGE_PACKAGES || '' }}
          RPKG_RUNIVERSE_PACKAGE_ARTIFACT_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_ARTIFACT_LIMIT || '-1' }}
          RPKG_RUNIVERSE_PACKAGE_MANUAL_TOPIC_LIMIT: ${{ vars.RPKG_RUNIVERSE_PACKAGE_MANUAL_TOPIC_LIMIT || '-1' }}
          RPKG_R_WEBSITE_LIMIT: ${{ vars.RPKG_R_WEBSITE_LIMIT || '8' }}
          RPKG_R_WEBSITE_CANDIDATE_LIMIT: ${{ vars.RPKG_R_WEBSITE_CANDIDATE_LIMIT || '80' }}
          RPKG_R_WEBSITE_FEED_LIMIT: ${{ vars.RPKG_R_WEBSITE_FEED_LIMIT || '20' }}
          RPKG_R_WEBSITE_LINK_LIMIT: ${{ vars.RPKG_R_WEBSITE_LINK_LIMIT || '80' }}
          RPKG_R_WEBSITE_SITEMAP_LIMIT: ${{ vars.RPKG_R_WEBSITE_SITEMAP_LIMIT || '20' }}
          RPKG_GITHUB_LIMIT: ${{ vars.RPKG_GITHUB_LIMIT || '40' }}
          RPKG_OSV_LIMIT: ${{ vars.RPKG_OSV_LIMIT || '60' }}
          RPKG_BIBLIOMETRIC_LIMIT: ${{ vars.RPKG_BIBLIOMETRIC_LIMIT || '25' }}
          RPKG_RUNIVERSE_UNIVERSES: ${{ vars.RPKG_RUNIVERSE_UNIVERSES || 'ropensci,tidyverse' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/rproject-collector package --job "$RPKG_JOB"

      - name: Collect public R YouTube signals
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'social'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CH_DATABASE: Data_R_Community_Service
          CH_TIMEOUT: ${{ vars.R_YOUTUBE_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.R_YOUTUBE_CLICKHOUSE_CHUNK_SIZE || '10' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.R_YOUTUBE_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.R_YOUTUBE_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.R_YOUTUBE_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          R_YOUTUBE_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.R_YOUTUBE_PUBLISH_TRANSIENT_FAIL_OPEN || 'true' }}
          R_YOUTUBE_DB_SEEDS_REQUIRED: ${{ vars.R_YOUTUBE_DB_SEEDS_REQUIRED || 'false' }}
          R_YOUTUBE_JOB: ${{ steps.opts.outputs.r_youtube_job }}
          R_YOUTUBE_SEED_LIMIT: ${{ vars.R_YOUTUBE_SEED_LIMIT || '200' }}
          R_YOUTUBE_PAGE_LIMIT: ${{ vars.R_YOUTUBE_PAGE_LIMIT || '20' }}
          R_YOUTUBE_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_VIDEO_LIMIT || '20' }}
          R_YOUTUBE_TRANSCRIPT_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_TRANSCRIPT_VIDEO_LIMIT || '3' }}
          R_YOUTUBE_TRANSCRIPT_TRACK_LIMIT: ${{ vars.R_YOUTUBE_TRANSCRIPT_TRACK_LIMIT || '1' }}
          R_YOUTUBE_TRANSCRIPT_LANGS: ${{ vars.R_YOUTUBE_TRANSCRIPT_LANGS || 'ko,en,en-US' }}
          R_YOUTUBE_COMMENT_VIDEO_LIMIT: ${{ vars.R_YOUTUBE_COMMENT_VIDEO_LIMIT || '3' }}
          R_YOUTUBE_COMMENT_MAX_RESULTS: ${{ vars.R_YOUTUBE_COMMENT_MAX_RESULTS || '25' }}
          R_YOUTUBE_COMMENT_PAGE_LIMIT: ${{ vars.R_YOUTUBE_COMMENT_PAGE_LIMIT || '1' }}
          R_YOUTUBE_INCLUDE_COMMENT_REPLIES: ${{ vars.R_YOUTUBE_INCLUDE_COMMENT_REPLIES || 'false' }}
          R_YOUTUBE_BACKFILL_LIMIT: ${{ vars.R_YOUTUBE_BACKFILL_LIMIT || '30' }}
          R_YOUTUBE_SEARCH_EVENT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_EVENT_LIMIT || '50' }}
          R_YOUTUBE_SEARCH_QUERY_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_QUERY_LIMIT || '20' }}
          R_YOUTUBE_SEARCH_RESULT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_RESULT_LIMIT || '50' }}
          R_YOUTUBE_SEARCH_VIDEO_ENRICH_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_VIDEO_ENRICH_LIMIT || '5' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.GOOGLE_YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_ALIAS: ${{ vars.YOUTUBE_API_KEY_ALIAS || 'default' }}
          YOUTUBE_DL_BIN: yt-dlp
        run: go run ./cmd/rproject-collector youtube --job "$R_YOUTUBE_JOB"

      - name: Collect R-bloggers
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'social'
        env:
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          TRANSLATE_ENABLED: ${{ vars.RBLOGGER_TRANSLATE_ENABLED || 'true' }}
          MAX_PAGES_FROM_HOME: ${{ vars.RBLOGGER_MAX_PAGES_FROM_HOME || '1' }}
          MAX_URLS: ${{ vars.RBLOGGER_MAX_URLS || '10' }}
          STALE_TRANSLATION_LIMIT: ${{ vars.RBLOGGER_STALE_TRANSLATION_LIMIT || '5' }}
          RBLOGGER_FAIL_ON_LIST_ERROR: ${{ vars.RBLOGGER_FAIL_ON_LIST_ERROR || 'false' }}
          RBLOGGER_HTTP_ATTEMPTS: ${{ vars.RBLOGGER_HTTP_ATTEMPTS || '4' }}
          RBLOGGER_HTTP_RETRY_DELAY_SEC: ${{ vars.RBLOGGER_HTTP_RETRY_DELAY_SEC || '2' }}
          RBLOGGER_HTTP_TIMEOUT: ${{ vars.RBLOGGER_HTTP_TIMEOUT || '30' }}
          RBLOGGER_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.RBLOGGER_PUBLISH_TRANSIENT_FAIL_OPEN || 'true' }}
          RBLOGGER_DIRECT_OUTBOX_DRAIN_LIMIT: ${{ vars.RBLOGGER_DIRECT_OUTBOX_DRAIN_LIMIT || '25' }}
          SLEEP_SEC: ${{ vars.RBLOGGER_SLEEP_SEC || '0.5' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_TIMEOUT: ${{ vars.RBLOGGER_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.RBLOGGER_CLICKHOUSE_CHUNK_SIZE || '20' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.RBLOGGER_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.RBLOGGER_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.RBLOGGER_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.rblogger_rebuild_board }}" = "true" ]; then
            go run ./cmd/rblogger-pipeline --rebuild-board
          else
            go run ./cmd/rblogger-pipeline
          fi

      - name: Collect R Foundation public Mastodon RSS
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'social'
        env:
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE || 'https://fosstodon.org' }}
          MASTODON_ACCT: ${{ vars.MASTODON_ACCT || 'R_Foundation' }}
          MASTODON_LIMIT: ${{ vars.MASTODON_LIMIT || '20' }}
          MASTODON_TRANSLATE_ENABLED: ${{ vars.MASTODON_TRANSLATE_ENABLED || 'true' }}
          MASTODON_STALE_TRANSLATION_LIMIT: ${{ vars.MASTODON_STALE_TRANSLATION_LIMIT || '5' }}
          MASTODON_TRANSLATION_MODEL: ${{ vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          MASTODON_DIRECT_OUTBOX_DRAIN_LIMIT: ${{ vars.MASTODON_DIRECT_OUTBOX_DRAIN_LIMIT || '25' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          CH_TIMEOUT: ${{ vars.MASTODON_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.MASTODON_CLICKHOUSE_CHUNK_SIZE || '20' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.MASTODON_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.MASTODON_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.MASTODON_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.mastodon_backfill_board }}" = "true" ]; then
            go run ./cmd/rproject-collector mastodon --backfill-board
          else
            go run ./cmd/rproject-collector mastodon
          fi

      - name: Collect R community sources
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        env:
          STATGROUND_USER_AGENT: ${{ vars.STATGROUND_USER_AGENT || 'StatgroundRCollector/1.0 (+https://www.statground.net)' }}
          R_COMMUNITY_REQUEST_DELAY: ${{ vars.R_COMMUNITY_REQUEST_DELAY || '0.5' }}
        run: |
          python scripts/collect_r_sources.py \
            --config config/r_sources.yaml \
            --out-dir data/collected/r \
            --since-days "${{ steps.opts.outputs.r_community_since_days }}" \
            --request-delay "$R_COMMUNITY_REQUEST_DELAY" \
            --log-level INFO

      - name: Show R Community collection report
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/collected/r/latest_report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "item_count": report.get("item_count"),
              "error_count": report.get("error_count"),
              "top_sources": dict(list((report.get("source_counts") or {}).items())[:20]),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate R Community collection report
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        env:
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
        run: |
          python scripts/validate_r_community_collection.py \
            --config config/r_sources.yaml \
            --jsonl data/collected/r/latest.jsonl \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS"

      - name: Publish R Community events to ClickHouse
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        id: publish_community
        env:
          R_COMMUNITY_EVENT_LIMIT: ${{ vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || 'community:stackoverflow:r,community:posit:latest-r-filtered,reddit:r/rstats,reddit:r/rprogramming' }}
          R_COMMUNITY_PRIORITY_SOURCE_IDS: ${{ vars.R_COMMUNITY_PRIORITY_SOURCE_IDS || 'community:posit:events' }}
          R_COMMUNITY_TRANSLATE_ENABLED: ${{ vars.R_COMMUNITY_TRANSLATE_ENABLED || 'true' }}
          R_COMMUNITY_TRANSLATION_LIMIT: ${{ vars.R_COMMUNITY_TRANSLATION_LIMIT || vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_TRANSLATION_MODEL: ${{ vars.R_COMMUNITY_TRANSLATION_MODEL || vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR: ${{ vars.R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR || 'true' }}
          R_COMMUNITY_SKIP_EXISTING_CANONICAL: ${{ vars.R_COMMUNITY_SKIP_EXISTING_CANONICAL || 'true' }}
          R_COMMUNITY_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.R_COMMUNITY_PUBLISH_TRANSIENT_FAIL_OPEN || 'true' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          CH_TIMEOUT: ${{ vars.R_COMMUNITY_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.R_COMMUNITY_CLICKHOUSE_CHUNK_SIZE || '10' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.R_COMMUNITY_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.R_COMMUNITY_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.R_COMMUNITY_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          set -o pipefail
          go run ./cmd/rproject-collector community \
            --jsonl data/collected/r/latest.jsonl \
            --report data/collected/r/latest_report.json \
            --limit "$R_COMMUNITY_EVENT_LIMIT" \
            --translate="$R_COMMUNITY_TRANSLATE_ENABLED" \
            --translation-limit "$R_COMMUNITY_TRANSLATION_LIMIT" \
            --translation-model "$R_COMMUNITY_TRANSLATION_MODEL" \
            --skip-existing-canonical="$R_COMMUNITY_SKIP_EXISTING_CANONICAL" \
            --fail-on-translation-error="$R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR" \
            | tee /tmp/r_community_publish.out
          if grep -q '^\[community\] publish_deferred' /tmp/r_community_publish.out; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for R Community ClickHouse ingestion
        if: (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community') && steps.publish_community.outputs.deferred != 'true'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
          R_COMMUNITY_WAIT_QUERY_TIMEOUT: ${{ vars.R_COMMUNITY_WAIT_QUERY_TIMEOUT || '90' }}
        run: |
          python scripts/wait_r_community_ingestion.py source \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS" \
            --query-timeout "$R_COMMUNITY_WAIT_QUERY_TIMEOUT" \
            --attempts 36 \
            --sleep 10

      - name: Generate R Community daily digests
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community-digest'
        id: community_digest
        env:
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST: ${{ vars.R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST || '80' }}
          R_COMMUNITY_DIGEST_MODEL: ${{ vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_DIGEST_MISSING_ONLY: ${{ vars.R_COMMUNITY_DIGEST_MISSING_ONLY || 'true' }}
          R_COMMUNITY_DIGEST_LATEST_PER_SOURCE: ${{ vars.R_COMMUNITY_DIGEST_LATEST_PER_SOURCE || 'true' }}
          R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE: ${{ vars.R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE || 'true' }}
          R_COMMUNITY_DIGEST_TRANSIENT_FAIL_OPEN: ${{ vars.R_COMMUNITY_DIGEST_TRANSIENT_FAIL_OPEN || 'true' }}
          R_COMMUNITY_DIGEST_PUBLISH_KAFKA: ${{ vars.R_COMMUNITY_DIGEST_PUBLISH_KAFKA || 'false' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_CHUNK_SIZE || '1' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_ATTEMPTS || '4' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_BACKOFF_SECONDS || '3' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          CH_TIMEOUT: ${{ vars.R_COMMUNITY_DIGEST_CH_TIMEOUT || '180' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          go run ./cmd/rproject-collector community-digest \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --items-per-digest "$R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST" \
            --missing-only="$R_COMMUNITY_DIGEST_MISSING_ONLY" \
            --latest-per-source="$R_COMMUNITY_DIGEST_LATEST_PER_SOURCE" \
            --insert-clickhouse="$R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE" \
            --publish-kafka="$R_COMMUNITY_DIGEST_PUBLISH_KAFKA" \
            --plan-output "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            | tee /tmp/r_community_digest.out
          if grep -q '^\[community-digest\] digest_deferred=true' /tmp/r_community_digest.out; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for R Community daily digest visibility
        if: (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community-digest') && steps.community_digest.outputs.deferred != 'true'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
        run: |
          python scripts/wait_r_community_ingestion.py digest \
            --digest-output /tmp/r_community_digest.out \
            --plan "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            --source-types "$R_COMMUNITY_DIGEST_SOURCE_TYPES" \
            --exclude-sources "$R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS" \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --attempts 36 \
            --sleep 10

      - name: Generate and insert Web-R Notebook
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'notebook'
        id: generate_notebook
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          WEBR_NOTEBOOK_DAILY_CH_MAX_EXECUTION_TIME: ${{ vars.WEBR_NOTEBOOK_DAILY_CH_MAX_EXECUTION_TIME || '120' }}
          WEBR_NOTEBOOK_DAILY_CH_MAX_THREADS: ${{ vars.WEBR_NOTEBOOK_DAILY_CH_MAX_THREADS || '1' }}
          WEBR_NOTEBOOK_DAILY_HTTP_TIMEOUT: ${{ vars.WEBR_NOTEBOOK_DAILY_HTTP_TIMEOUT || '150' }}
          WEBR_NOTEBOOK_DAILY_READ_ATTEMPTS: ${{ vars.WEBR_NOTEBOOK_DAILY_READ_ATTEMPTS || '4' }}
          WEBR_NOTEBOOK_DAILY_READ_BACKOFF_SECONDS: ${{ vars.WEBR_NOTEBOOK_DAILY_READ_BACKOFF_SECONDS || '3' }}
          WEBR_NOTEBOOK_DAILY_INSERT_ATTEMPTS: ${{ vars.WEBR_NOTEBOOK_DAILY_INSERT_ATTEMPTS || '6' }}
          WEBR_NOTEBOOK_DAILY_INSERT_BACKOFF_SECONDS: ${{ vars.WEBR_NOTEBOOK_DAILY_INSERT_BACKOFF_SECONDS || '10' }}
          WEBR_NOTEBOOK_DAILY_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.WEBR_NOTEBOOK_DAILY_PUBLISH_TRANSIENT_FAIL_OPEN || 'true' }}
          WEBR_NOTEBOOK_SOURCE_CONTEXT_ENABLED: ${{ vars.WEBR_NOTEBOOK_SOURCE_CONTEXT_ENABLED || 'true' }}
          WEBR_NOTEBOOK_SOURCE_LOOKBACK_DAYS: ${{ vars.WEBR_NOTEBOOK_SOURCE_LOOKBACK_DAYS || '21' }}
          WEBR_NOTEBOOK_SOURCE_LIMIT: ${{ vars.WEBR_NOTEBOOK_SOURCE_LIMIT || '24' }}
        run: |
          args=()
          if [[ -n "${{ steps.opts.outputs.webr_notebook_date }}" ]]; then
            args+=(--date "${{ steps.opts.outputs.webr_notebook_date }}")
          fi
          if [[ "${{ steps.opts.outputs.webr_notebook_force_new }}" == "true" ]]; then
            args+=(--force-new)
          fi
          if [[ "${{ steps.opts.outputs.webr_notebook_dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          : > /tmp/webr_notebook_daily_results.jsonl
          count="${{ steps.opts.outputs.webr_notebook_count }}"
          for index in $(seq 1 "$count"); do
            iteration_args=("${args[@]}")
            if (( index > 1 )); then
              iteration_args+=(--force-new)
            fi
            output="/tmp/webr_notebook_daily_result_${index}.json"
            python scripts/generate_webr_notebook_daily.py \
              --runner scripts/webr_notebook_runner.mjs \
              --output "$output" \
              --batch-history /tmp/webr_notebook_daily_results.jsonl \
              "${iteration_args[@]}"
            python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), ensure_ascii=False))' "$output" >> /tmp/webr_notebook_daily_results.jsonl
          done
          cp "/tmp/webr_notebook_daily_result_${count}.json" /tmp/webr_notebook_daily_result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = [json.loads(line) for line in Path("/tmp/webr_notebook_daily_results.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          expected = int("${{ steps.opts.outputs.webr_notebook_count }}")
          if len(results) != expected:
              raise SystemExit(f"Notebook batch produced {len(results)} results; expected {expected}")
          if not all(item.get("inserted") or item.get("dry_run") for item in results):
              raise SystemExit("Notebook batch contains a skipped or deferred insert")
          for key in ("share_uuid", "title", "blueprint_fingerprint", "data_design", "validation_lens", "visual_grammar", "narrative_frame", "webr_package"):
              values = [str(item.get(key, "")) for item in results]
              if any(not value for value in values) or len(set(values)) != expected:
                  raise SystemExit(f"Notebook batch diversity contract failed for {key}: unique={len(set(values))}/{expected}")

          result = json.loads(Path("/tmp/webr_notebook_daily_result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key in ("inserted", "dry_run", "skipped", "notebook_uuid", "share_uuid", "title", "url"):
                  value = result.get(key, "")
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  print(f"{key}={value}", file=out)
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Validate Web-R CDN2 publish settings
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
        run: |
          test -n "$STATGROUND_CDN2_ADMIN_TOKEN" || { echo "STATGROUND_CDN2_ADMIN_TOKEN secret is required"; exit 1; }
          test -n "$R_ECOSYSTEM_CONTENT_KEY" || { echo "R_ECOSYSTEM_CONTENT_KEY secret is required"; exit 1; }

      - name: Ensure Web-R CDN2 repositories
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_contents --description "Statground Web-R CDN2 R ecosystem encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_packages --description "Statground Web-R CDN2 R package encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_community --description "Statground Web-R CDN2 community encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2 --description "Statground Web-R CDN2 app assets and admin snapshots"

      - name: Checkout Web-R CDN2 contents
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_contents
          ref: main
          path: web-r_CDN2_contents
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Checkout Web-R CDN2 packages
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_packages
          ref: main
          path: web-r_CDN2_packages
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Checkout Web-R CDN2 community
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_community
          ref: main
          path: web-r_CDN2_community
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Export encrypted Web-R CDN2 content
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CLICKHOUSE_DEFAULT_DATABASE: Clickhouse_Statground
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
          R_PACKAGE_REQUIRED_NEWS_SOURCES: ${{ vars.R_PACKAGE_REQUIRED_NEWS_SOURCES || 'official:r-mail:r-packages' }}
          R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES: ${{ vars.R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES || 'CRAN,Bioconductor,R-universe' }}
          R_ECOSYSTEM_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.R_ECOSYSTEM_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          R_ECOSYSTEM_CDN_HTTP_TIMEOUT: ${{ vars.R_ECOSYSTEM_CDN_HTTP_TIMEOUT || '150' }}
          R_ECOSYSTEM_CDN_CH_MAX_THREADS: ${{ vars.R_ECOSYSTEM_CDN_CH_MAX_THREADS || '2' }}
          R_ECOSYSTEM_CDN_EXPORT_TRANSIENT_FAIL_OPEN: ${{ vars.R_ECOSYSTEM_CDN_EXPORT_TRANSIENT_FAIL_OPEN || 'true' }}
          R_PACKAGE_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.R_PACKAGE_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          R_PACKAGE_CDN_HTTP_TIMEOUT: ${{ vars.R_PACKAGE_CDN_HTTP_TIMEOUT || '150' }}
          R_PACKAGE_CDN_CH_MAX_THREADS: ${{ vars.R_PACKAGE_CDN_CH_MAX_THREADS || '2' }}
          R_PACKAGE_CDN_EXPORT_TRANSIENT_FAIL_OPEN: ${{ vars.R_PACKAGE_CDN_EXPORT_TRANSIENT_FAIL_OPEN || 'true' }}
          WEBR_COMMUNITY_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.WEBR_COMMUNITY_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          WEBR_COMMUNITY_CDN_HTTP_TIMEOUT: ${{ vars.WEBR_COMMUNITY_CDN_HTTP_TIMEOUT || '150' }}
          WEBR_COMMUNITY_CDN_CH_MAX_THREADS: ${{ vars.WEBR_COMMUNITY_CDN_CH_MAX_THREADS || '2' }}
          WEBR_COMMUNITY_CDN_EXPORT_TRANSIENT_FAIL_OPEN: ${{ vars.WEBR_COMMUNITY_CDN_EXPORT_TRANSIENT_FAIL_OPEN || 'true' }}
        run: |
          python scripts/test_export_r_package_cdn.py
          python scripts/test_export_community_cdn.py
          python scripts/test_record_web_r_cdn_release.py
          python scripts/export_r_ecosystem_cdn.py --cdn-root web-r_CDN2_contents --language ko > /tmp/r_ecosystem_export.json
          previous_package_commit="$(git -C web-r_CDN2_packages rev-parse HEAD)"
          python scripts/export_r_package_cdn.py \
            --cdn-root web-r_CDN2_packages \
            --language ko \
            --previous-release-base-url "https://cdn.jsdelivr.net/gh/statground/web-r_CDN2_packages@${previous_package_commit}" \
            > /tmp/r_package_export.json
          python scripts/validate_r_package_registry_v2.py \
            --cdn-root web-r_CDN2_packages \
            --language ko
          python scripts/export_community_cdn.py --cdn-root web-r_CDN2_community --language ko > /tmp/community_export.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          r_eco = json.loads(Path("/tmp/r_ecosystem_export.json").read_text(encoding="utf-8"))
          r_package = json.loads(Path("/tmp/r_package_export.json").read_text(encoding="utf-8"))
          community = json.loads(Path("/tmp/community_export.json").read_text(encoding="utf-8"))
          required_package_news_sources = [
              source.strip()
              for source in os.environ.get("R_PACKAGE_REQUIRED_NEWS_SOURCES", "").split(",")
              if source.strip()
          ]
          required_recent_update_repositories = [
              repository.strip()
              for repository in os.environ.get("R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES", "").split(",")
              if repository.strip()
          ]
          if r_package.get("export_deferred"):
              print("Package CDN export was deferred; skipping package source completeness guards.")
          else:
              package_news_sources = r_package.get("news_sources") or {}
              missing_package_news_sources = [
                  source
                  for source in required_package_news_sources
                  if int(package_news_sources.get(source) or 0) <= 0
              ]
              if missing_package_news_sources:
                  raise SystemExit(
                      "Package CDN export is missing required package news source(s): "
                      + ", ".join(missing_package_news_sources)
                  )
              package_recent_update_counts = {
                  str(repository).strip().lower(): int(count or 0)
                  for repository, count in (r_package.get("package_recent_update_counts") or {}).items()
              }
              missing_recent_update_repositories = [
                  repository
                  for repository in required_recent_update_repositories
                  if package_recent_update_counts.get(repository.lower(), 0) <= 0
              ]
              if missing_recent_update_repositories:
                  raise SystemExit(
                      "Package CDN export is missing recent-update package signal(s): "
                      + ", ".join(missing_recent_update_repositories)
                  )
          reports = {
              "contents": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-content",
                  "r_ecosystem": r_eco,
                  "r_ecosystem_export": int(r_eco.get("export") or 0),
                  "manifest_paths": ["contents/ko/index.json"],
              },
              "packages": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-packages",
                  "r_package": r_package,
                  "packages": int(r_package.get("packages") or 0),
                  "news": int(r_package.get("news") or 0),
                  "package_details": int(r_package.get("package_details") or 0),
                  "manifest_paths": ["packages/ko/index.json", "packages/ko/versions.json", "packages/ko/v2/registry.json"],
              },
              "community": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-community",
                  "community": community,
                  "community_export": int(community.get("community_export") or community.get("export") or 0),
                  "workshop_export": int(community.get("workshop_export") or community.get("workshop") or 0),
                  "workshop_posts": int(community.get("workshop_posts") or 0),
                  "manifest_paths": ["community/ko/index.json", "community/ko/workshop/index.json"],
              },
          }
          for key, report in reports.items():
              report["item_count"] = int(report.get("r_ecosystem_export") or 0) + int(report.get("community_export") or 0) + int(report.get("workshop_export") or 0) + int(report.get("packages") or 0) + int(report.get("news") or 0) + int(report.get("package_details") or 0)
              Path(f"web_r_cdn2_{key}_export_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          combined = {
              "schema": "web-r.content-cdn.export-report.v2",
              "language": "ko",
              "r_ecosystem": r_eco,
              "r_package": r_package,
              "community": community,
              "reports": reports,
          }
          Path("web_r_content_cdn_export_report.json").write_text(json.dumps(combined, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({key: report["item_count"] for key, report in reports.items()}, ensure_ascii=False))
          PY

      - name: Commit and push Web-R CDN2 contents
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_contents
        working-directory: web-r_CDN2_contents
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_contents.git"
          git add contents
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 contents are already up to date."
            exit 0
          fi
          git commit -m "Refresh Web-R CDN2 encrypted contents"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push Web-R CDN2 packages
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_packages
        working-directory: web-r_CDN2_packages
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_packages.git"
          changed=false
          git add packages/ko/index.json packages/ko/versions.json packages/ko/news packages/ko/v2
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package news"
            git push origin HEAD:main
            changed=true
          fi
          for prefix in "a-d" "e-h" "i-l" "m-p" "q-t" "u-z"; do
            git add ":(glob)packages/ko/details/[${prefix}]*.json"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "Refresh Web-R CDN2 encrypted package details ${prefix}"
            git push origin HEAD:main
            changed=true
          done
          git add packages
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package remainder"
            git push origin HEAD:main
            changed=true
          fi
          if [[ "$changed" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 packages are already up to date."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push Web-R CDN2 community
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_community
        working-directory: web-r_CDN2_community
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_community.git"
          git add community
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 community is already up to date."
            exit 0
          fi
          git commit -m "Refresh Web-R CDN2 encrypted community"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record Web-R CDN2 releases
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN || 'true' }}
          WEB_R_CDN_RELEASE_RECORD_ATTEMPTS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_ATTEMPTS || '3' }}
          WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS || '2' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS || '1' }}
        run: |
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_contents_export_report.json").read_text(encoding="utf-8")); sys.exit(0 if (report.get("r_ecosystem") or {}).get("export_deferred") else 1)'; then
            echo "Web-R CDN2 content export was deferred; keeping the existing content release pointer."
            printf '%s\n' '{"record_skipped":true,"reason":"export_deferred"}' > /tmp/web_r_cdn_record_contents.json
          else
            python scripts/record_web_r_cdn_release.py \
              --report web_r_cdn2_contents_export_report.json \
              --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
              --repo statground/web-r_CDN2_contents \
              --branch main \
              --scope web-r-content \
              --language ko > /tmp/web_r_cdn_record_contents.json
            cat /tmp/web_r_cdn_record_contents.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_packages_export_report.json").read_text(encoding="utf-8")); sys.exit(0 if (report.get("r_package") or {}).get("export_deferred") else 1)'; then
            echo "Web-R CDN2 package export was deferred; keeping the existing package release pointer."
            printf '%s\n' '{"record_skipped":true,"reason":"export_deferred"}' > /tmp/web_r_cdn_record_packages.json
          else
            python scripts/record_web_r_cdn_release.py \
              --report web_r_cdn2_packages_export_report.json \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --repo statground/web-r_CDN2_packages \
              --branch main \
              --scope web-r-packages \
              --language ko > /tmp/web_r_cdn_record_packages.json
            cat /tmp/web_r_cdn_record_packages.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_community_export_report.json").read_text(encoding="utf-8")); sys.exit(0 if (report.get("community") or {}).get("export_deferred") else 1)'; then
            echo "Web-R CDN2 community export was deferred; keeping the existing community release pointer."
            printf '%s\n' '{"record_skipped":true,"reason":"export_deferred"}' > /tmp/web_r_cdn_record_community.json
          else
            python scripts/record_web_r_cdn_release.py \
              --report web_r_cdn2_community_export_report.json \
              --commit-sha "${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
              --repo statground/web-r_CDN2_community \
              --branch main \
              --scope web-r-community \
              --language ko > /tmp/web_r_cdn_record_community.json
            cat /tmp/web_r_cdn_record_community.json
          fi

      - name: Verify Web-R CDN2 release pointers
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN || 'true' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS || '1' }}
          WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN || 'true' }}
        run: |
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_contents_export_report.json").read_text(encoding="utf-8")); status_path=pathlib.Path("/tmp/web_r_cdn_record_contents.json"); status=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}; sys.exit(0 if (report.get("r_ecosystem") or {}).get("export_deferred") or status.get("record_deferred") or status.get("record_skipped") else 1)'; then
            echo "Web-R CDN2 content release record was deferred or skipped; skipping content release pointer verification."
          else
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-content \
              --language ko \
              --repo statground/web-r_CDN2_contents \
              --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
              --manifest contents/ko/index.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_packages_export_report.json").read_text(encoding="utf-8")); status_path=pathlib.Path("/tmp/web_r_cdn_record_packages.json"); status=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}; sys.exit(0 if (report.get("r_package") or {}).get("export_deferred") or status.get("record_deferred") or status.get("record_skipped") else 1)'; then
            echo "Web-R CDN2 package release record was deferred or skipped; skipping package release pointer verification."
          else
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-packages \
              --language ko \
              --repo statground/web-r_CDN2_packages \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --manifest packages/ko/index.json
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-packages \
              --language ko \
              --repo statground/web-r_CDN2_packages \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --manifest packages/ko/v2/registry.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_community_export_report.json").read_text(encoding="utf-8")); status_path=pathlib.Path("/tmp/web_r_cdn_record_community.json"); status=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}; sys.exit(0 if (report.get("community") or {}).get("export_deferred") or status.get("record_deferred") or status.get("record_skipped") else 1)'; then
            echo "Web-R CDN2 community release record was deferred or skipped; skipping community release pointer verification."
          else
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-community \
              --language ko \
              --repo statground/web-r_CDN2_community \
              --commit-sha "${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
              --manifest community/ko/index.json
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-community \
              --language ko \
              --repo statground/web-r_CDN2_community \
              --commit-sha "${{ steps.web_r_cdn2_community.outputs.commit_sha }}" \
              --manifest community/ko/workshop/index.json
          fi

      - name: Checkout Web-R CDN2 admin snapshots
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2
          ref: main
          path: web-r_CDN2
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Export admin pipeline monitor CDN snapshot
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CLICKHOUSE_DEFAULT_DATABASE: Clickhouse_Statground
          WEBR_GITHUB_ACTIONS_TOKEN: ${{ secrets.WEBR_GITHUB_ACTIONS_TOKEN || secrets.GITHUB_ACTIONS_STATUS_TOKEN || secrets.STATGROUND_CDN2_ADMIN_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/export_admin_pipeline_monitor.py --cdn-root web-r_CDN2 --language ko > /tmp/admin_pipeline_export.json

      - name: Commit and push Web-R CDN2 admin pipeline snapshot
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_admin_pipelines
        working-directory: web-r_CDN2
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2.git"
          snapshot_file="${RUNNER_TEMP}/web-r-admin-pipelines-latest.json"
          cp admin/pipelines/latest.json "$snapshot_file"
          git restore --source=HEAD --staged --worktree admin/pipelines/latest.json
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git switch --detach FETCH_HEAD
            cp "$snapshot_file" admin/pipelines/latest.json
            git add admin/pipelines/latest.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "Web-R CDN2 admin pipeline snapshot is already up to date."
              exit 0
            fi
            git commit -m "Refresh admin pipeline monitor snapshot"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done
          echo "Unable to publish the admin pipeline snapshot after 3 attempts" >&2
          exit 1

      - name: Record Web-R CDN2 admin pipeline snapshot release
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN || 'true' }}
          WEB_R_CDN_RELEASE_RECORD_ATTEMPTS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_ATTEMPTS || '3' }}
          WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS || '2' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS || '1' }}
        run: |
          python scripts/record_web_r_cdn_release.py \
            --report /tmp/admin_pipeline_export.json \
            --commit-sha "${{ steps.web_r_cdn2_admin_pipelines.outputs.commit_sha }}" \
            --repo statground/web-r_CDN2 \
            --branch main \
            --scope web-r-admin-pipelines \
            --language ko > /tmp/web_r_cdn_record_admin_pipelines.json
          cat /tmp/web_r_cdn_record_admin_pipelines.json
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(
              Path("/tmp/web_r_cdn_record_admin_pipelines.json").read_text(encoding="utf-8")
          )
          if record.get("record_deferred"):
              raise SystemExit(
                  "Web-R CDN2 admin pipeline release record was deferred; treating it as a failed CDN publish."
              )
          PY

      - name: Verify Web-R CDN2 admin pipeline snapshot release
        if: always() && (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn') && steps.web_r_cdn2_admin_pipelines.outcome == 'success'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN || 'true' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS || '1' }}
          WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN || 'true' }}
        run: |
          python scripts/verify_web_r_cdn_release.py \
            --scope web-r-admin-pipelines \
            --language ko \
            --repo statground/web-r_CDN2 \
            --commit-sha "${{ steps.web_r_cdn2_admin_pipelines.outputs.commit_sha }}" \
            --manifest admin/pipelines/latest.json

      - name: Mark deferred CDN exports as degraded
        if: always() && (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "contents": ("web_r_cdn2_contents_export_report.json", "r_ecosystem"),
              "packages": ("web_r_cdn2_packages_export_report.json", "r_package"),
              "community": ("web_r_cdn2_community_export_report.json", "community"),
          }
          deferred = []
          for scope, (path, key) in checks.items():
              report_path = Path(path)
              if not report_path.exists():
                  deferred.append(f"{scope}:report_missing")
                  continue
              payload = json.loads(report_path.read_text(encoding="utf-8"))
              result = payload.get(key) or {}
              if result.get("export_deferred"):
                  deferred.append(f"{scope}:{result.get('deferred_reason') or 'deferred'}")
          if deferred:
              summary = "CDN publish degraded: " + ", ".join(deferred)
              print(f"::error::{summary}")
              summary_path = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
              summary_path.write_text("## CDN publish degraded\n\n" + summary + "\n", encoding="utf-8")
              raise SystemExit(1)
          print("All CDN export scopes produced fresh reports.")
          PY
