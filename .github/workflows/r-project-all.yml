          RBLOGGER_FAIL_ON_LIST_ERROR: ${{ vars.RBLOGGER_FAIL_ON_LIST_ERROR || 'false' }}
          RBLOGGER_HTTP_ATTEMPTS: ${{ vars.RBLOGGER_HTTP_ATTEMPTS || '4' }}
          RBLOGGER_HTTP_RETRY_DELAY_SEC: ${{ vars.RBLOGGER_HTTP_RETRY_DELAY_SEC || '2' }}
          RBLOGGER_HTTP_TIMEOUT: ${{ vars.RBLOGGER_HTTP_TIMEOUT || '30' }}
          RBLOGGER_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.RBLOGGER_PUBLISH_TRANSIENT_FAIL_OPEN || 'false' }}
          RBLOGGER_DIRECT_OUTBOX_DRAIN_LIMIT: ${{ vars.RBLOGGER_DIRECT_OUTBOX_DRAIN_LIMIT || '25' }}
          SLEEP_SEC: ${{ vars.RBLOGGER_SLEEP_SEC || '0.5' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_TIMEOUT: ${{ vars.RBLOGGER_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.RBLOGGER_CLICKHOUSE_CHUNK_SIZE || '20' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.RBLOGGER_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.RBLOGGER_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.RBLOGGER_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.rblogger_rebuild_board }}" = "true" ]; then
            go run ./cmd/rblogger-pipeline --rebuild-board
          else
            go run ./cmd/rblogger-pipeline
          fi

      - name: Collect R Foundation public Mastodon RSS
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'social'
        env:
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE || 'https://fosstodon.org' }}
          MASTODON_ACCT: ${{ vars.MASTODON_ACCT || 'R_Foundation' }}
          MASTODON_LIMIT: ${{ vars.MASTODON_LIMIT || '20' }}
          MASTODON_HTTP_ATTEMPTS: ${{ vars.MASTODON_HTTP_ATTEMPTS || '4' }}
          MASTODON_HTTP_RETRY_DELAY_SECONDS: ${{ vars.MASTODON_HTTP_RETRY_DELAY_SECONDS || '2' }}
          MASTODON_HTTP_TIMEOUT_SECONDS: ${{ vars.MASTODON_HTTP_TIMEOUT_SECONDS || '30' }}
          MASTODON_TRANSLATE_ENABLED: ${{ vars.MASTODON_TRANSLATE_ENABLED || 'true' }}
          MASTODON_STALE_TRANSLATION_LIMIT: ${{ vars.MASTODON_STALE_TRANSLATION_LIMIT || '5' }}
          MASTODON_TRANSLATION_MODEL: ${{ vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          MASTODON_DIRECT_OUTBOX_DRAIN_LIMIT: ${{ vars.MASTODON_DIRECT_OUTBOX_DRAIN_LIMIT || '25' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          CH_TIMEOUT: ${{ vars.MASTODON_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.MASTODON_CLICKHOUSE_CHUNK_SIZE || '20' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.MASTODON_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.MASTODON_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.MASTODON_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          if [ "${{ steps.opts.outputs.mastodon_backfill_board }}" = "true" ]; then
            go run ./cmd/rproject-collector mastodon --backfill-board
          else
            go run ./cmd/rproject-collector mastodon
          fi

      - name: Collect R community sources
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        env:
          STATGROUND_USER_AGENT: ${{ vars.STATGROUND_USER_AGENT || 'StatgroundRCollector/1.0 (+https://www.statground.net)' }}
          R_COMMUNITY_REQUEST_DELAY: ${{ vars.R_COMMUNITY_REQUEST_DELAY || '0.5' }}
        run: |
          python scripts/collect_r_sources.py \
            --config config/r_sources.yaml \
            --out-dir data/collected/r \
            --since-days "${{ steps.opts.outputs.r_community_since_days }}" \
            --request-delay "$R_COMMUNITY_REQUEST_DELAY" \
            --log-level INFO

      - name: Show R Community collection report
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/collected/r/latest_report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "item_count": report.get("item_count"),
              "error_count": report.get("error_count"),
              "top_sources": dict(list((report.get("source_counts") or {}).items())[:20]),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate R Community collection report
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        env:
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
        run: |
          python scripts/validate_r_community_collection.py \
            --config config/r_sources.yaml \
            --jsonl data/collected/r/latest.jsonl \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS"

      - name: Publish R Community events to ClickHouse
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community'
        id: publish_community
        env:
          R_COMMUNITY_EVENT_LIMIT: ${{ vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || 'community:stackoverflow:r,community:posit:latest-r-filtered,reddit:r/rstats,reddit:r/rprogramming' }}
          R_COMMUNITY_PRIORITY_SOURCE_IDS: ${{ vars.R_COMMUNITY_PRIORITY_SOURCE_IDS || 'community:posit:events' }}
          R_COMMUNITY_TRANSLATE_ENABLED: ${{ vars.R_COMMUNITY_TRANSLATE_ENABLED || 'true' }}
          R_COMMUNITY_TRANSLATION_LIMIT: ${{ vars.R_COMMUNITY_TRANSLATION_LIMIT || vars.R_COMMUNITY_EVENT_LIMIT || '1000' }}
          R_COMMUNITY_TRANSLATION_MODEL: ${{ vars.R_COMMUNITY_TRANSLATION_MODEL || vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR: ${{ vars.R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR || 'true' }}
          R_COMMUNITY_SKIP_EXISTING_CANONICAL: ${{ vars.R_COMMUNITY_SKIP_EXISTING_CANONICAL || 'true' }}
          R_COMMUNITY_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.R_COMMUNITY_PUBLISH_TRANSIENT_FAIL_OPEN || 'false' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          CH_TIMEOUT: ${{ vars.R_COMMUNITY_CH_TIMEOUT || '120' }}
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.R_COMMUNITY_CLICKHOUSE_CHUNK_SIZE || '10' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.R_COMMUNITY_CLICKHOUSE_ATTEMPTS || '6' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.R_COMMUNITY_CLICKHOUSE_BACKOFF_SECONDS || '10' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.R_COMMUNITY_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          set -o pipefail
          go run ./cmd/rproject-collector community \
            --jsonl data/collected/r/latest.jsonl \
            --report data/collected/r/latest_report.json \
            --limit "$R_COMMUNITY_EVENT_LIMIT" \
            --translate="$R_COMMUNITY_TRANSLATE_ENABLED" \
            --translation-limit "$R_COMMUNITY_TRANSLATION_LIMIT" \
            --translation-model "$R_COMMUNITY_TRANSLATION_MODEL" \
            --skip-existing-canonical="$R_COMMUNITY_SKIP_EXISTING_CANONICAL" \
            --fail-on-translation-error="$R_COMMUNITY_FAIL_ON_TRANSLATION_ERROR" \
            | tee /tmp/r_community_publish.out
          if grep -q '^\[community\] publish_deferred' /tmp/r_community_publish.out; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for R Community ClickHouse ingestion
        if: (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community') && steps.publish_community.outputs.deferred != 'true'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          R_COMMUNITY_REQUIRED_SOURCE_IDS: ${{ vars.R_COMMUNITY_REQUIRED_SOURCE_IDS || '' }}
          R_COMMUNITY_WAIT_QUERY_TIMEOUT: ${{ vars.R_COMMUNITY_WAIT_QUERY_TIMEOUT || '90' }}
        run: |
          python scripts/wait_r_community_ingestion.py source \
            --report data/collected/r/latest_report.json \
            --required-sources "$R_COMMUNITY_REQUIRED_SOURCE_IDS" \
            --query-timeout "$R_COMMUNITY_WAIT_QUERY_TIMEOUT" \
            --attempts 36 \
            --sleep 10

      - name: Generate R Community daily digests
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community-digest'
        id: community_digest
        env:
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST: ${{ vars.R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST || '80' }}
          R_COMMUNITY_DIGEST_MODEL: ${{ vars.R_COMMUNITY_DIGEST_MODEL || vars.MASTODON_TRANSLATION_MODEL || vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.5-flash-lite' }}
          R_COMMUNITY_DIGEST_MISSING_ONLY: ${{ vars.R_COMMUNITY_DIGEST_MISSING_ONLY || 'true' }}
          R_COMMUNITY_DIGEST_LATEST_PER_SOURCE: ${{ vars.R_COMMUNITY_DIGEST_LATEST_PER_SOURCE || 'true' }}
          R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE: ${{ vars.R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE || 'true' }}
          R_COMMUNITY_DIGEST_TRANSIENT_FAIL_OPEN: ${{ vars.R_COMMUNITY_DIGEST_TRANSIENT_FAIL_OPEN || 'false' }}
          R_COMMUNITY_DIGEST_PUBLISH_KAFKA: ${{ vars.R_COMMUNITY_DIGEST_PUBLISH_KAFKA || 'false' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
          RPROJECT_CLICKHOUSE_CHUNK_SIZE: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_CHUNK_SIZE || '1' }}
          RPROJECT_CLICKHOUSE_ATTEMPTS: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_ATTEMPTS || '4' }}
          RPROJECT_CLICKHOUSE_BACKOFF_SECONDS: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_BACKOFF_SECONDS || '3' }}
          RPROJECT_CLICKHOUSE_SPLIT_ON_TIMEOUT: ${{ vars.R_COMMUNITY_DIGEST_CLICKHOUSE_SPLIT_ON_TIMEOUT || 'true' }}
          CH_TIMEOUT: ${{ vars.R_COMMUNITY_DIGEST_CH_TIMEOUT || '180' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: Data_R_Community_Service
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          go run ./cmd/rproject-collector community-digest \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --items-per-digest "$R_COMMUNITY_DIGEST_ITEMS_PER_DIGEST" \
            --missing-only="$R_COMMUNITY_DIGEST_MISSING_ONLY" \
            --latest-per-source="$R_COMMUNITY_DIGEST_LATEST_PER_SOURCE" \
            --insert-clickhouse="$R_COMMUNITY_DIGEST_INSERT_CLICKHOUSE" \
            --publish-kafka="$R_COMMUNITY_DIGEST_PUBLISH_KAFKA" \
            --plan-output "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            | tee /tmp/r_community_digest.out
          if grep -q '^\[community-digest\] digest_deferred=true' /tmp/r_community_digest.out; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for R Community daily digest visibility
        if: (steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'community-digest') && steps.community_digest.outputs.deferred != 'true'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          R_COMMUNITY_DIGEST_SINCE_DAYS: ${{ vars.R_COMMUNITY_DIGEST_SINCE_DAYS || steps.opts.outputs.r_community_since_days }}
          R_COMMUNITY_DIGEST_SOURCE_TYPES: ${{ vars.R_COMMUNITY_DIGEST_SOURCE_TYPES || 'community_forum,qna_feed,social_tag,fediverse_group' }}
          R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS: ${{ vars.R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS || 'mastodon:group:rstats' }}
          R_COMMUNITY_DIGEST_PLAN_OUTPUT: /tmp/r_community_digest_plan.json
        run: |
          python scripts/wait_r_community_ingestion.py digest \
            --digest-output /tmp/r_community_digest.out \
            --plan "$R_COMMUNITY_DIGEST_PLAN_OUTPUT" \
            --source-types "$R_COMMUNITY_DIGEST_SOURCE_TYPES" \
            --exclude-sources "$R_COMMUNITY_DIGEST_EXCLUDED_SOURCE_IDS" \
            --since-days "$R_COMMUNITY_DIGEST_SINCE_DAYS" \
            --attempts 36 \
            --sleep 10

      - name: Generate and insert Web-R Notebook
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'notebook'
        id: generate_notebook
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          WEBR_NOTEBOOK_DAILY_CH_MAX_EXECUTION_TIME: ${{ vars.WEBR_NOTEBOOK_DAILY_CH_MAX_EXECUTION_TIME || '120' }}
          WEBR_NOTEBOOK_DAILY_CH_MAX_THREADS: ${{ vars.WEBR_NOTEBOOK_DAILY_CH_MAX_THREADS || '1' }}
          WEBR_NOTEBOOK_DAILY_HTTP_TIMEOUT: ${{ vars.WEBR_NOTEBOOK_DAILY_HTTP_TIMEOUT || '150' }}
          WEBR_NOTEBOOK_DAILY_READ_ATTEMPTS: ${{ vars.WEBR_NOTEBOOK_DAILY_READ_ATTEMPTS || '4' }}
          WEBR_NOTEBOOK_DAILY_READ_BACKOFF_SECONDS: ${{ vars.WEBR_NOTEBOOK_DAILY_READ_BACKOFF_SECONDS || '3' }}
          WEBR_NOTEBOOK_DAILY_INSERT_ATTEMPTS: ${{ vars.WEBR_NOTEBOOK_DAILY_INSERT_ATTEMPTS || '6' }}
          WEBR_NOTEBOOK_DAILY_INSERT_BACKOFF_SECONDS: ${{ vars.WEBR_NOTEBOOK_DAILY_INSERT_BACKOFF_SECONDS || '10' }}
          WEBR_NOTEBOOK_DAILY_PUBLISH_TRANSIENT_FAIL_OPEN: ${{ vars.WEBR_NOTEBOOK_DAILY_PUBLISH_TRANSIENT_FAIL_OPEN || 'false' }}
          WEBR_NOTEBOOK_SOURCE_CONTEXT_ENABLED: ${{ vars.WEBR_NOTEBOOK_SOURCE_CONTEXT_ENABLED || 'true' }}
          WEBR_NOTEBOOK_SOURCE_LOOKBACK_DAYS: ${{ vars.WEBR_NOTEBOOK_SOURCE_LOOKBACK_DAYS || '21' }}
          WEBR_NOTEBOOK_SOURCE_LIMIT: ${{ vars.WEBR_NOTEBOOK_SOURCE_LIMIT || '24' }}
        run: |
          args=()
          if [[ -n "${{ steps.opts.outputs.webr_notebook_date }}" ]]; then
            args+=(--date "${{ steps.opts.outputs.webr_notebook_date }}")
          fi
          if [[ "${{ steps.opts.outputs.webr_notebook_force_new }}" == "true" ]]; then
            args+=(--force-new)
          fi
          if [[ "${{ steps.opts.outputs.webr_notebook_dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          : > /tmp/webr_notebook_daily_results.jsonl
          count="${{ steps.opts.outputs.webr_notebook_count }}"
          for index in $(seq 1 "$count"); do
            iteration_args=("${args[@]}")
            if (( index > 1 )); then
              iteration_args+=(--force-new)
            fi
            output="/tmp/webr_notebook_daily_result_${index}.json"
            python scripts/generate_webr_notebook_daily.py \
              --runner scripts/webr_notebook_runner.mjs \
              --output "$output" \
              --batch-history /tmp/webr_notebook_daily_results.jsonl \
              "${iteration_args[@]}"
            python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), ensure_ascii=False))' "$output" >> /tmp/webr_notebook_daily_results.jsonl
          done
          cp "/tmp/webr_notebook_daily_result_${count}.json" /tmp/webr_notebook_daily_result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = [json.loads(line) for line in Path("/tmp/webr_notebook_daily_results.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          expected = int("${{ steps.opts.outputs.webr_notebook_count }}")
          if len(results) != expected:
              raise SystemExit(f"Notebook batch produced {len(results)} results; expected {expected}")
          if not all(item.get("inserted") or item.get("dry_run") for item in results):
              raise SystemExit("Notebook batch contains a skipped or deferred insert")
          for key in ("share_uuid", "title", "blueprint_fingerprint", "data_design", "validation_lens", "visual_grammar", "narrative_frame", "webr_package"):
              values = [str(item.get(key, "")) for item in results]
              if any(not value for value in values) or len(set(values)) != expected:
                  raise SystemExit(f"Notebook batch diversity contract failed for {key}: unique={len(set(values))}/{expected}")

          result = json.loads(Path("/tmp/webr_notebook_daily_result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key in ("inserted", "dry_run", "skipped", "notebook_uuid", "share_uuid", "title", "url"):
                  value = result.get(key, "")
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  print(f"{key}={value}", file=out)
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Validate Web-R CDN2 publish settings
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
        run: |
          test -n "$STATGROUND_CDN2_ADMIN_TOKEN" || { echo "STATGROUND_CDN2_ADMIN_TOKEN secret is required"; exit 1; }
          test -n "$R_ECOSYSTEM_CONTENT_KEY" || { echo "R_ECOSYSTEM_CONTENT_KEY secret is required"; exit 1; }

      - name: Ensure Web-R CDN2 repositories
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_contents --description "Statground Web-R CDN2 R ecosystem encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2_packages --description "Statground Web-R CDN2 R package encrypted content"
          python scripts/ensure_cdn2_repo.py --repo statground/web-r_CDN2 --description "Statground Web-R CDN2 app assets and admin snapshots"

      - name: Checkout Web-R CDN2 contents
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_contents
          ref: main
          path: web-r_CDN2_contents
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Checkout Web-R CDN2 packages
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2_packages
          ref: main
          path: web-r_CDN2_packages
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Export encrypted Web-R CDN2 content
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CLICKHOUSE_DEFAULT_DATABASE: Clickhouse_Statground
          R_ECOSYSTEM_CONTENT_KEY: ${{ secrets.R_ECOSYSTEM_CONTENT_KEY }}
          R_PACKAGE_REQUIRED_NEWS_SOURCES: ${{ vars.R_PACKAGE_REQUIRED_NEWS_SOURCES || 'official:r-mail:r-packages' }}
          R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES: ${{ vars.R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES || 'CRAN,Bioconductor,R-universe' }}
          R_ECOSYSTEM_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.R_ECOSYSTEM_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          R_ECOSYSTEM_CDN_HTTP_TIMEOUT: ${{ vars.R_ECOSYSTEM_CDN_HTTP_TIMEOUT || '150' }}
          R_ECOSYSTEM_CDN_CH_MAX_THREADS: ${{ vars.R_ECOSYSTEM_CDN_CH_MAX_THREADS || '2' }}
          R_ECOSYSTEM_CDN_EXPORT_TRANSIENT_FAIL_OPEN: ${{ vars.R_ECOSYSTEM_CDN_EXPORT_TRANSIENT_FAIL_OPEN || 'false' }}
          R_PACKAGE_CDN_CH_MAX_EXECUTION_TIME: ${{ vars.R_PACKAGE_CDN_CH_MAX_EXECUTION_TIME || '120' }}
          R_PACKAGE_CDN_HTTP_TIMEOUT: ${{ vars.R_PACKAGE_CDN_HTTP_TIMEOUT || '150' }}
          R_PACKAGE_CDN_CH_MAX_THREADS: ${{ vars.R_PACKAGE_CDN_CH_MAX_THREADS || '2' }}
          R_PACKAGE_CDN_EXPORT_TRANSIENT_FAIL_OPEN: ${{ vars.R_PACKAGE_CDN_EXPORT_TRANSIENT_FAIL_OPEN || 'false' }}
        run: |
          python scripts/test_export_r_package_cdn.py
          python scripts/test_record_web_r_cdn_release.py
          python scripts/export_r_ecosystem_cdn.py --cdn-root web-r_CDN2_contents --language ko > /tmp/r_ecosystem_export.json
          previous_package_commit="$(git -C web-r_CDN2_packages rev-parse HEAD)"
          python scripts/export_r_package_cdn.py \
            --cdn-root web-r_CDN2_packages \
            --language ko \
            --previous-release-base-url "https://cdn.jsdelivr.net/gh/statground/web-r_CDN2_packages@${previous_package_commit}" \
            > /tmp/r_package_export.json
          python scripts/validate_r_package_registry_v2.py \
            --cdn-root web-r_CDN2_packages \
            --language ko
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          r_eco = json.loads(Path("/tmp/r_ecosystem_export.json").read_text(encoding="utf-8"))
          r_package = json.loads(Path("/tmp/r_package_export.json").read_text(encoding="utf-8"))
          required_package_news_sources = [
              source.strip()
              for source in os.environ.get("R_PACKAGE_REQUIRED_NEWS_SOURCES", "").split(",")
              if source.strip()
          ]
          required_recent_update_repositories = [
              repository.strip()
              for repository in os.environ.get("R_PACKAGE_REQUIRED_RECENT_UPDATE_REPOSITORIES", "").split(",")
              if repository.strip()
          ]
          if r_package.get("export_deferred"):
              print("Package CDN export was deferred; skipping package source completeness guards.")
          else:
              package_news_sources = r_package.get("news_sources") or {}
              missing_package_news_sources = [
                  source
                  for source in required_package_news_sources
                  if int(package_news_sources.get(source) or 0) <= 0
              ]
              if missing_package_news_sources:
                  raise SystemExit(
                      "Package CDN export is missing required package news source(s): "
                      + ", ".join(missing_package_news_sources)
                  )
              package_recent_update_counts = {
                  str(repository).strip().lower(): int(count or 0)
                  for repository, count in (r_package.get("package_recent_update_counts") or {}).items()
              }
              missing_recent_update_repositories = [
                  repository
                  for repository in required_recent_update_repositories
                  if package_recent_update_counts.get(repository.lower(), 0) <= 0
              ]
              if missing_recent_update_repositories:
                  raise SystemExit(
                      "Package CDN export is missing recent-update package signal(s): "
                      + ", ".join(missing_recent_update_repositories)
                  )
          reports = {
              "contents": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-content",
                  "r_ecosystem": r_eco,
                  "r_ecosystem_export": int(r_eco.get("export") or 0),
                  "manifest_paths": ["contents/ko/index.json"],
              },
              "packages": {
                  "schema": "web-r.content-cdn.export-report.v2",
                  "language": "ko",
                  "scope": "web-r-packages",
                  "r_package": r_package,
                  "packages": int(r_package.get("packages") or 0),
                  "news": int(r_package.get("news") or 0),
                  "package_details": int(r_package.get("package_details") or 0),
                  "manifest_paths": ["packages/ko/index.json", "packages/ko/versions.json", "packages/ko/v2/registry.json"],
              },
          }
          for key, report in reports.items():
              report["item_count"] = int(report.get("r_ecosystem_export") or 0) + int(report.get("community_export") or 0) + int(report.get("workshop_export") or 0) + int(report.get("packages") or 0) + int(report.get("news") or 0) + int(report.get("package_details") or 0)
              Path(f"web_r_cdn2_{key}_export_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          combined = {
              "schema": "web-r.content-cdn.export-report.v2",
              "language": "ko",
              "r_ecosystem": r_eco,
              "r_package": r_package,
              "reports": reports,
          }
          Path("web_r_content_cdn_export_report.json").write_text(json.dumps(combined, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({key: report["item_count"] for key, report in reports.items()}, ensure_ascii=False))
          PY

      - name: Commit and push Web-R CDN2 contents
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_contents
        working-directory: web-r_CDN2_contents
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_contents.git"
          git add contents
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 contents are already up to date."
            exit 0
          fi
          git commit -m "Refresh Web-R CDN2 encrypted contents"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push Web-R CDN2 packages
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        id: web_r_cdn2_packages
        working-directory: web-r_CDN2_packages
        env:
          STATGROUND_CDN2_ADMIN_TOKEN: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
        run: |
          git config user.name "statground-r-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${STATGROUND_CDN2_ADMIN_TOKEN}@github.com/statground/web-r_CDN2_packages.git"
          changed=false
          git add packages/ko/index.json packages/ko/versions.json packages/ko/news packages/ko/v2
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package news"
            git push origin HEAD:main
            changed=true
          fi
          for prefix in "a-d" "e-h" "i-l" "m-p" "q-t" "u-z"; do
            git add ":(glob)packages/ko/details/[${prefix}]*.json"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "Refresh Web-R CDN2 encrypted package details ${prefix}"
            git push origin HEAD:main
            changed=true
          done
          git add packages
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Web-R CDN2 encrypted package remainder"
            git push origin HEAD:main
            changed=true
          fi
          if [[ "$changed" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Web-R CDN2 packages are already up to date."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record Web-R CDN2 releases
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_RECORD_TRANSIENT_FAIL_OPEN || 'false' }}
          WEB_R_CDN_RELEASE_RECORD_ATTEMPTS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_ATTEMPTS || '3' }}
          WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_BACKOFF_SECONDS || '2' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_RECORD_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_RECORD_CH_MAX_THREADS || '1' }}
        run: |
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_contents_export_report.json").read_text(encoding="utf-8")); sys.exit(0 if (report.get("r_ecosystem") or {}).get("export_deferred") else 1)'; then
            echo "Web-R CDN2 content export was deferred; keeping the existing content release pointer."
            printf '%s\n' '{"record_skipped":true,"reason":"export_deferred"}' > /tmp/web_r_cdn_record_contents.json
          else
            python scripts/record_web_r_cdn_release.py \
              --report web_r_cdn2_contents_export_report.json \
              --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
              --repo statground/web-r_CDN2_contents \
              --branch main \
              --scope web-r-content \
              --language ko > /tmp/web_r_cdn_record_contents.json
            cat /tmp/web_r_cdn_record_contents.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_packages_export_report.json").read_text(encoding="utf-8")); sys.exit(0 if (report.get("r_package") or {}).get("export_deferred") else 1)'; then
            echo "Web-R CDN2 package export was deferred; keeping the existing package release pointer."
            printf '%s\n' '{"record_skipped":true,"reason":"export_deferred"}' > /tmp/web_r_cdn_record_packages.json
          else
            python scripts/record_web_r_cdn_release.py \
              --report web_r_cdn2_packages_export_report.json \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --repo statground/web-r_CDN2_packages \
              --branch main \
              --scope web-r-packages \
              --language ko > /tmp/web_r_cdn_record_packages.json
            cat /tmp/web_r_cdn_record_packages.json
          fi

      - name: Verify Web-R CDN2 release pointers
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
          CH_HTTP_URL_PATH: ${{ secrets.CH_HTTP_URL_PATH || secrets.CLICKHOUSE_HTTP_URL_PATH }}
          WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_TRANSIENT_FAIL_OPEN || 'false' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_EXECUTION_TIME || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_HTTP_TIMEOUT || '45' }}
          WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_CH_MAX_THREADS || '1' }}
          WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN: ${{ vars.WEB_R_CDN_RELEASE_VERIFY_POINTER_MISMATCH_FAIL_OPEN || 'false' }}
        run: |
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_contents_export_report.json").read_text(encoding="utf-8")); status_path=pathlib.Path("/tmp/web_r_cdn_record_contents.json"); status=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}; sys.exit(0 if (report.get("r_ecosystem") or {}).get("export_deferred") or status.get("record_deferred") or status.get("record_skipped") else 1)'; then
            echo "Web-R CDN2 content release record was deferred or skipped; skipping content release pointer verification."
          else
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-content \
              --language ko \
              --repo statground/web-r_CDN2_contents \
              --commit-sha "${{ steps.web_r_cdn2_contents.outputs.commit_sha }}" \
              --manifest contents/ko/index.json
          fi
          if python -c 'import json, pathlib, sys; report=json.loads(pathlib.Path("web_r_cdn2_packages_export_report.json").read_text(encoding="utf-8")); status_path=pathlib.Path("/tmp/web_r_cdn_record_packages.json"); status=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}; sys.exit(0 if (report.get("r_package") or {}).get("export_deferred") or status.get("record_deferred") or status.get("record_skipped") else 1)'; then
            echo "Web-R CDN2 package release record was deferred or skipped; skipping package release pointer verification."
          else
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-packages \
              --language ko \
              --repo statground/web-r_CDN2_packages \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --manifest packages/ko/index.json
            python scripts/verify_web_r_cdn_release.py \
              --scope web-r-packages \
              --language ko \
              --repo statground/web-r_CDN2_packages \
              --commit-sha "${{ steps.web_r_cdn2_packages.outputs.commit_sha }}" \
              --manifest packages/ko/v2/registry.json
          fi

      - name: Checkout Web-R CDN2 admin snapshots
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        uses: actions/checkout@v7
        with:
          repository: statground/web-r_CDN2
          ref: main
          path: web-r_CDN2
          token: ${{ secrets.STATGROUND_CDN2_ADMIN_TOKEN }}
          persist-credentials: false

      - name: Export admin pipeline monitor CDN snapshot
        if: steps.opts.outputs.scope == 'all' || steps.opts.outputs.scope == 'cdn'
        env:
          CLICKHOUSE_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CH_PROTOCOL || secrets.CLICKHOUSE_PROTOCOL || 'http' }}
