name: R Project CDN Publish

on:
  schedule:
    # 23:07 KST. Runs after notebook generation and before the next package window.
    - cron: "7 14 * * *"
  push:
    tags:
      - "webr-cdn-publish-*"
  workflow_dispatch:
    inputs:
      r_locale_batch:
        description: "Optional one or two R ecosystem locales; empty rotates all non-Korean locales"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cdn:
    name: CDN publish and admin snapshot
    uses: ./.github/workflows/r-project-all.yml
    with:
      scope: cdn
      r_locale_batch: ${{ inputs.r_locale_batch || '' }}
    secrets: inherit
