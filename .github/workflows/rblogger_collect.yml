name: R-bloggers - Crawl to Kafka

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      max_pages_from_home:
        description: "Optional MAX_PAGES_FROM_HOME override"
        required: false
        default: ""
      max_urls:
        description: "Optional MAX_URLS override. 0 means no cap."
        required: false
        default: ""
      stale_translation_limit:
        description: "Optional STALE_TRANSLATION_LIMIT override. 0 disables stale retranslation."
        required: false
        default: ""
      rebuild_board:
        description: "Set true to deactivate existing board rows and rebuild all board translations from raw."
        required: false
        default: "false"
      rebuild_limit:
        description: "Optional RBLOGGER_REBUILD_LIMIT override. 0 means full rebuild; positive values rebuild only that many UUIDs."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: statground-data-r-project-rblogger
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      KAFKA_TOPIC: webr.events
      KAFKA_CLIENT_ID: statground-rblogger-crawler
      PRODUCER_SOURCE: github_actions
      PRODUCER_IP: "::"
      TRANSLATE_ENABLED: ${{ vars.RBLOGGER_TRANSLATE_ENABLED || 'true' }}
      MAX_PAGES_FROM_HOME: ${{ github.event.inputs.max_pages_from_home || vars.RBLOGGER_MAX_PAGES_FROM_HOME || '1' }}
      MAX_URLS: ${{ github.event.inputs.max_urls || vars.RBLOGGER_MAX_URLS || '0' }}
      STALE_TRANSLATION_LIMIT: ${{ github.event.inputs.stale_translation_limit || vars.RBLOGGER_STALE_TRANSLATION_LIMIT || '20' }}
      REBUILD_BOARD: ${{ github.event.inputs.rebuild_board || 'false' }}
      RBLOGGER_REBUILD_LIMIT: ${{ github.event.inputs.rebuild_limit || vars.RBLOGGER_REBUILD_LIMIT || '0' }}
      RBLOGGER_REBUILD_BATCH_SIZE: ${{ vars.RBLOGGER_REBUILD_BATCH_SIZE || '50' }}
      SLEEP_SEC: ${{ vars.RBLOGGER_SLEEP_SEC || '1.0' }}
      RBLOGGER_TRANSLATION_MODEL: ${{ vars.RBLOGGER_TRANSLATION_MODEL || 'google/gemini-2.0-flash-exp:free' }}
      FAIL_ON_CRAWL_ERROR: ${{ vars.RBLOGGER_FAIL_ON_CRAWL_ERROR || 'false' }}
      FAIL_ON_TRANSLATION_ERROR: ${{ vars.RBLOGGER_FAIL_ON_TRANSLATION_ERROR || 'false' }}
      KAFKA_BATCH_SIZE: ${{ vars.RBLOGGER_KAFKA_BATCH_SIZE || '50' }}
      KAFKA_WRITE_CHUNK_SIZE: ${{ vars.RBLOGGER_KAFKA_WRITE_CHUNK_SIZE || '50' }}
      KAFKA_MAX_MESSAGE_BYTES: ${{ vars.RBLOGGER_KAFKA_MAX_MESSAGE_BYTES || '524288' }}
      STATE_PATH: .rblogger_state/seen_urls.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore crawler state
        uses: actions/cache/restore@v4
        with:
          path: collectors/rblogger/.rblogger_state
          key: rblogger-crawler-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rblogger-crawler-state-${{ github.ref_name }}-
            rblogger-crawler-state-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collectors/rblogger/go.mod
          cache-dependency-path: collectors/rblogger/go.sum
          cache: true

      - name: Validate required secrets
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          TRANSLATE_ENABLED_LC="$(printf '%s' "${TRANSLATE_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          REBUILD_BOARD_LC="$(printf '%s' "${REBUILD_BOARD}" | tr '[:upper:]' '[:lower:]')"
          if [ "$REBUILD_BOARD_LC" != "true" ]; then
            test -n "$KAFKA_BROKERS" || { echo "KAFKA_BROKERS secret is required"; exit 1; }
            test -n "$KAFKA_USERNAME" || { echo "Kafka SASL username is required. Add KAFKA_USERNAME or KAFKA_EXTERNAL_USER"; exit 1; }
            test -n "$KAFKA_PASSWORD" || { echo "Kafka SASL password is required. Add KAFKA_PASSWORD or KAFKA_EXTERNAL_PASSWORD"; exit 1; }
            case ",$KAFKA_BROKERS," in
              *,127.0.0.1,*|*,localhost,*|*,0.0.0.0,*|*,::1,*)
                echo "KAFKA_BROKERS must be externally reachable, not a loopback address"
                exit 1
                ;;
            esac
          fi
          if { [ "$TRANSLATE_ENABLED_LC" != "false" ] && [ "${STALE_TRANSLATION_LIMIT:-0}" != "0" ]; } || [ "$REBUILD_BOARD_LC" = "true" ]; then
            test -n "$CH_HOST" || { echo "CH_HOST or CLICKHOUSE_HOST secret is required when stale retranslation or board rebuild is enabled"; exit 1; }
            test -n "$CH_USER" || { echo "CH_USER or CLICKHOUSE_USER secret is required when stale retranslation or board rebuild is enabled"; exit 1; }
            test -n "$CH_PASSWORD" || { echo "CH_PASSWORD or CLICKHOUSE_PASSWORD secret is required when stale retranslation or board rebuild is enabled"; exit 1; }
          fi
          AI_PROVIDER_COUNT=0
          test -n "$OPENROUTER_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$GROQ_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$CEREBRAS_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          test -n "$GH_MODELS_API_KEY" && AI_PROVIDER_COUNT=$((AI_PROVIDER_COUNT + 1))
          if { [ "$TRANSLATE_ENABLED_LC" != "false" ] || [ "$REBUILD_BOARD_LC" = "true" ]; } && [ "$AI_PROVIDER_COUNT" -eq 0 ]; then
            echo "At least one AI provider secret is required when translation or board rebuild is enabled"
            exit 1
          fi

      - name: Build R-blogger pipeline
        working-directory: collectors/rblogger
        run: |
          go build ./cmd/rblogger-pipeline

      - name: Crawl R-bloggers or rebuild board translations
        working-directory: collectors/rblogger
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_DATABASE: ${{ secrets.CH_DATABASE || secrets.CLICKHOUSE_DATABASE || 'Data_R_Blogger_Raw' }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE }}
          CH_TIMEOUT: ${{ secrets.CH_TIMEOUT || secrets.CLICKHOUSE_TIMEOUT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: |
          REBUILD_BOARD_LC="$(printf '%s' "${REBUILD_BOARD}" | tr '[:upper:]' '[:lower:]')"
          if [ "$REBUILD_BOARD_LC" = "true" ]; then
            go run ./cmd/rblogger-pipeline --rebuild-board
          else
            go run ./cmd/rblogger-pipeline
          fi

      - name: Save crawler state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collectors/rblogger/.rblogger_state
          key: rblogger-crawler-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
