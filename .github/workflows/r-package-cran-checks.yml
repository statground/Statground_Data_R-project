name: R Package - CRAN Checks

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit check rows; 0 means all"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: r-package-cran-checks
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e collectors/rpkg
      - name: Run CRAN checks collector
        env:
          RPKG_KAFKA_TOPIC: ${{ vars.RPKG_KAFKA_TOPIC || 'rpkg.events' }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          RPKG_CRAN_CHECK_LIMIT: ${{ github.event.inputs.limit || vars.RPKG_CRAN_CHECK_LIMIT || '0' }}
        run: rpkg-collector cran-checks --limit "$RPKG_CRAN_CHECK_LIMIT"
