name: R Community

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Only keep items newer than N days when published_at exists. Use -1 for no date filtering."
        required: false
        default: "14"
      commit_output:
        description: "Commit collected JSONL output under data/collected/r. False uploads artifacts only."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r-community
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set run options
        id: opts
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "since_days=${{ inputs.since_days }}" >> "$GITHUB_OUTPUT"
            echo "commit_output=${{ inputs.commit_output }}" >> "$GITHUB_OUTPUT"
          else
            echo "since_days=${{ vars.R_COMMUNITY_SINCE_DAYS || '14' }}" >> "$GITHUB_OUTPUT"
            echo "commit_output=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
      - name: Collect R community sources
        env:
          STATGROUND_USER_AGENT: ${{ vars.STATGROUND_USER_AGENT || 'StatgroundRCollector/1.0 (+https://www.statground.net)' }}
          R_COMMUNITY_REQUEST_DELAY: ${{ vars.R_COMMUNITY_REQUEST_DELAY || '0.8' }}
        run: |
          python scripts/collect_r_sources.py \
            --config config/r_sources.yaml \
            --out-dir data/collected/r \
            --since-days "${{ steps.opts.outputs.since_days }}" \
            --request-delay "$R_COMMUNITY_REQUEST_DELAY" \
            --log-level INFO
      - name: Show R Community collection report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/collected/r/latest_report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "item_count": report.get("item_count"),
              "error_count": report.get("error_count"),
              "top_sources": dict(list((report.get("source_counts") or {}).items())[:20]),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload R Community artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-community-${{ github.run_id }}
          path: |
            data/collected/r/latest.jsonl
            data/collected/r/latest_report.json
            data/collected/r/r_sources_*.jsonl
            data/collected/r/r_sources_report_*.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit output when requested
        if: ${{ steps.opts.outputs.commit_output == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/collected/r
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): collect R Community sources"
            git push
          fi
