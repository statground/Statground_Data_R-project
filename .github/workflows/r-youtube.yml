name: R YouTube Public Collection

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "all, seeds, pages, search, or links"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: r-youtube-public
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate ClickHouse settings
        env:
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
        run: |
          test -n "$CH_HOST" || { echo "ClickHouse host secret is required"; exit 1; }
          test -n "$CH_USER" || { echo "ClickHouse user secret is required"; exit 1; }
          test -n "$CH_PASSWORD" || { echo "ClickHouse password secret is required"; exit 1; }
      - name: Collect public R YouTube signals
        env:
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME || secrets.KAFKA_EXTERNAL_USER }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD || secrets.KAFKA_EXTERNAL_PASSWORD }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'SASL_PLAINTEXT' }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM || 'PLAIN' }}
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CH_DATABASE: Data_R_Youtube_Service
          R_YOUTUBE_KAFKA_TOPIC: ${{ vars.R_YOUTUBE_KAFKA_TOPIC || 'r.youtube.events' }}
          R_YOUTUBE_JOB: ${{ github.event.inputs.job || vars.R_YOUTUBE_JOB || 'all' }}
          R_YOUTUBE_SEED_LIMIT: ${{ vars.R_YOUTUBE_SEED_LIMIT || '0' }}
          R_YOUTUBE_PAGE_LIMIT: ${{ vars.R_YOUTUBE_PAGE_LIMIT || '30' }}
          R_YOUTUBE_SEARCH_EVENT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_EVENT_LIMIT || '0' }}
          R_YOUTUBE_SEARCH_QUERY_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_QUERY_LIMIT || '40' }}
          R_YOUTUBE_SEARCH_RESULT_LIMIT: ${{ vars.R_YOUTUBE_SEARCH_RESULT_LIMIT || '80' }}
        run: go run ./cmd/rproject-collector youtube --job "$R_YOUTUBE_JOB"
